<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1C2333" />
  <title>POKPOK</title>
  <style>
    :root{
      --ink:#1C2333;
      --bg:#F4F3EF;
      --yellow:#F2B705;
      --orange:#E1550B;
      --green:#2F7A4D;
      --line:#DAD7CC;
      --muted:#8A8F9C;
      --card:#FFFFFF;
      --list-1-bg:#E5E8ED;
      --list-1-ink:#414A59;
      --list-1-border:#A4AAB5;
      --list-2-bg:#DDEFE4;
      --list-2-ink:#245C3B;
      --list-2-border:#8FBE9F;
      --list-3-bg:#F6E3E8;
      --list-3-ink:#7A3C4C;
      --list-3-border:#D9A7B3;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{
      width:795px;
      max-width:100%;
      min-height:100vh;
      margin:0 auto;
      background:var(--bg)
    }
    .topbar{
      position:sticky;top:0;z-index:20;
      background:var(--ink);
      padding:18px 15px 14px;
      border-radius:0 0 18px 18px;
      box-shadow:0 2px 12px rgba(0,0,0,.12);
    }
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title-tools{display:flex;align-items:center;gap:8px}
    .title{
      color:#fff;font-family:Arial Narrow,Arial,sans-serif;
      text-transform:uppercase;font-size:24px;font-weight:900;letter-spacing:.5px
    }
    .language-switch{
      display:flex;
      align-items:center;
      padding:3px;
      border-radius:8px;
      background:#2A3247
    }
    .language-switch button{
      min-width:34px;
      height:34px;
      padding:0 8px;
      border:0;
      border-radius:6px;
      background:transparent;
      color:#AAB1C1;
      font-size:11px;
      font-weight:900
    }
    .language-switch button.active{
      background:#fff;
      color:var(--ink)
    }
    .cart-summary-btn{
      border:0;
      background:var(--yellow);
      color:var(--ink);
      min-height:40px;
      padding:7px 11px;
      border-radius:8px;
      display:flex;
      align-items:center;
      gap:9px;
      font-size:12px;
      font-weight:900
    }
    .cart-summary-icon{font-size:19px;line-height:1}
    .cart-summary-count{
      min-width:22px;
      height:22px;
      padding:0 6px;
      border-radius:11px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:var(--ink);
      color:#fff;
      font-size:11px
    }
    .cart-summary-total{
      padding-left:9px;
      border-left:1px solid rgba(28,35,51,.25);
      white-space:nowrap
    }
    .cart-summary-btn:disabled{opacity:.55;cursor:default}
    .top-actions{display:flex;gap:8px;margin-top:12px}
    .search{
      flex:1;display:flex;align-items:center;gap:8px;
      background:#2A3247;border-radius:8px;padding:9px 10px
    }
    .search input{
      width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:14px
    }
    .search input::placeholder{color:#8A93A8}
    .icon-btn{
      border:0;border-radius:8px;padding:0 12px;min-width:42px;
      display:flex;align-items:center;justify-content:center;font-size:18px
    }
    .dark-btn{background:#2A3247;color:#fff}
    .filter-btn.active{background:var(--yellow);color:var(--ink)}
    .yellow-btn{background:var(--yellow);color:var(--ink)}
    .filter-dropdown{
      position:absolute;
      top:calc(100% - 6px);
      left:15px;
      right:15px;
      z-index:30;
      display:none;
      max-height:min(62vh,520px);
      overflow:auto;
      padding:14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      color:var(--ink);
      box-shadow:0 14px 32px rgba(28,35,51,.24)
    }
    .filter-dropdown.open{display:block}
    .filter-dropdown-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px
    }
    .filter-dropdown-head strong{font-size:14px}
    .filter-dropdown-close{
      width:30px;
      height:30px;
      padding:0;
      border:0;
      border-radius:7px;
      background:#F4F3EF;
      color:var(--ink);
      font-size:20px;
      line-height:1
    }
    .archive-top-btn{
      gap:7px;
      padding:0 11px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap
    }
    .chatgpt-link{
      text-decoration:none;
      gap:7px;
      padding:0 11px;
      min-height:42px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap
    }
    .chatgpt-link:visited{color:#fff}
    .chatgpt-link:hover{background:#36405A}
    .chatgpt-link-icon{
      font-size:16px;
      line-height:1
    }
    .archive-count{
      min-width:20px;
      height:20px;
      padding:0 6px;
      border-radius:10px;
      background:var(--yellow);
      color:var(--ink);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:900
    }
    .archive-list{display:flex;flex-direction:column;gap:8px}
    .archive-empty{
      border:1px dashed var(--line);
      border-radius:10px;
      padding:28px 14px;
      text-align:center;
      color:var(--muted);
      font-size:13px
    }
    .archive-item{
      display:flex;
      align-items:flex-start;
      gap:11px;
      border:1px solid var(--line);
      border-radius:9px;
      padding:9px;
      background:#FAFAF8
    }
    .archive-item-copy{flex:1;min-width:0}
    .archive-item-name{
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }
    .archive-item-meta{
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      overflow-wrap:anywhere
    }
    .archive-item-price{margin-top:4px;color:var(--green);font-size:11px;font-weight:800}
    .archive-item-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      flex-wrap:wrap;
      flex:0 0 auto;
      max-width:210px
    }
    .archive-item-actions .list-pick{flex:0 0 auto}
    .archive-item-actions .add,
    .archive-item-actions .minus,
    .archive-item-actions .plus{
      min-width:30px;
      height:30px
    }
    .archive-item-actions .add{height:auto;min-height:30px}
    .archive-item-actions strong{min-width:18px;text-align:center;font-size:13px}
    .restore-btn{
      flex:0 0 auto;
      border:0;
      border-radius:7px;
      padding:8px 11px;
      background:var(--green);
      color:#fff;
      font-size:12px;
      font-weight:800
    }
    @media(max-width:560px){
      .archive-item{flex-wrap:wrap}
      .archive-item-copy{min-width:calc(100% - 70px)}
      .archive-item-actions{width:100%;max-width:none;justify-content:flex-end}
    }
    .restore-all-row{
      display:flex;
      justify-content:flex-end;
      margin:0 0 12px
    }
    .restore-all-btn{
      border:1px solid var(--line);
      border-radius:7px;
      padding:8px 12px;
      background:#FAFAF8;
      color:var(--ink);
      font-size:12px;
      font-weight:800
    }
    .content{padding:14px 15px}
    .panel{
      background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;
      margin-bottom:12px
    }
    .panel-title{
      font-size:12px;text-transform:uppercase;letter-spacing:.5px;
      font-weight:800;color:var(--muted);margin-bottom:10px
    }
    .running-low-toggle{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0;
      margin:0 0 10px;
      border:0;
      background:transparent;
      color:var(--muted);
      text-align:left;
      cursor:pointer
    }
    .running-low-toggle-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-weight:800
    }
    .running-low-toggle-meta{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:800
    }
    .running-low-toggle-arrow{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:22px;
      height:22px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#FAFAF8;
      color:var(--ink);
      transition:transform .18s ease
    }
    .running-low-panel.collapsed .running-low-toggle-arrow{
      transform:rotate(-90deg)
    }
    .running-low-panel.collapsed .running-low-content{
      display:none
    }
    .running-low-panel.collapsed .running-low-toggle{
      margin-bottom:0
    }
    .suggestions{display:flex;flex-direction:column;gap:8px}
    .suggestion{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      border:1px solid var(--line);border-radius:8px;padding:9px 10px
    }
    .suggestion strong{font-size:13px}
    .suggestion small{display:block;color:var(--muted);margin-top:2px}
    .suggestion-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      flex-shrink:0
    }
    .suggestion-add{
      min-width:43px;
      border:0;
      background:var(--yellow);
      border-radius:6px;
      padding:7px 10px;
      color:#111;
      font-weight:800
    }
    @media(max-width:640px){
      .suggestion{align-items:flex-start}
      .suggestion-actions{flex-direction:column;align-items:flex-end}
    }
    .category{margin-bottom:18px}
    .category-head{
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px
    }
    .category-name{
      font-family:Arial Narrow,Arial,sans-serif;
      text-transform:uppercase;font-size:15px;font-weight:800;letter-spacing:.6px
    }
    .category-head button{border:0;background:none;color:var(--ink);opacity:.6;font-size:18px}
    .items{display:flex;flex-direction:column;gap:6px}
    .item{
      background:#fff;border:1px solid var(--line);border-radius:8px;
      padding:10px 10px 10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px
    }
    [data-selected-list="1"]{
      --selected-list-card-bg:#FAFBFC;
      --selected-list-border:var(--list-1-border)
    }
    [data-selected-list="2"]{
      --selected-list-card-bg:#F7FCF8;
      --selected-list-border:var(--list-2-border)
    }
    [data-selected-list="3"]{
      --selected-list-card-bg:#FFF7F9;
      --selected-list-border:var(--list-3-border)
    }
    .item[data-selected-list],
    .suggestion[data-selected-list],
    .archive-item[data-selected-list],
    .checkout-recommendation[data-selected-list],
    .cart-item[data-selected-list]{
      border-color:var(--selected-list-border);
      background:var(--selected-list-card-bg);
      box-shadow:inset 4px 0 0 var(--selected-list-border)
    }
    .item-content{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
    .item-photo-wrap{
      width:48px;height:48px;border-radius:8px;overflow:hidden;flex:0 0 48px;
      border:1px solid var(--line);background:#FAFAF8;display:flex;align-items:center;justify-content:center
    }
    .item-photo{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
    .item-photo-fallback{font-size:20px;color:var(--muted)}
    .item-main{min-width:0;flex:1}
    .item-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-unit{font-size:11px;color:var(--muted);margin-top:3px}
    .item-receipt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:#586174;margin-top:3px;line-height:1.25;white-space:normal}
    .item-receipt + .item-receipt{margin-top:1px}
    .price-badge{font-size:11px;color:var(--muted);margin-top:2px}
    .price-up{color:var(--orange);font-weight:800}
    .price-down{color:var(--green);font-weight:800}
    .qty{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      flex-shrink:0;
      flex-wrap:wrap
    }
    .qty button{
      width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
      font-weight:900
    }
    .list-pick{
      display:flex;
      align-items:center;
      gap:3px;
      padding:3px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#F5F4EF
    }
    .list-pick button{
      width:25px;
      height:25px;
      border:0;
      border-radius:5px;
      background:transparent;
      color:var(--muted);
      font-size:11px;
      font-weight:900
    }
    .list-pick button.selected{
      background:var(--ink);
      color:#fff
    }
    .item-list-summary{
      display:flex;
      align-items:center;
      gap:5px;
      flex-wrap:wrap;
      margin-top:5px
    }
    .list-mini-badge{
      display:inline-flex;
      align-items:center;
      min-height:20px;
      padding:2px 7px;
      border-radius:10px;
      background:#EEF0F4;
      color:#3E4659;
      font-size:10px;
      font-weight:800
    }
    .list-mini-badge[data-list-number="1"]{
      background:var(--list-1-bg);
      color:var(--list-1-ink)
    }
    .list-mini-badge[data-list-number="2"]{
      background:var(--list-2-bg);
      color:var(--list-2-ink)
    }
    .list-mini-badge[data-list-number="3"]{
      background:var(--list-3-bg);
      color:var(--list-3-ink)
    }
    @media(max-width:640px){
      .item{align-items:flex-start}
      .qty{max-width:150px}
      .list-pick{order:1}
      .add,.minus,.plus,.qty strong{order:2}
      .remove{order:3}
    }
    .minus{border:1px solid var(--line);background:#FAFAF8}
    .plus{border:0;background:var(--yellow)}
    .add{
      border:0;background:var(--ink);color:#fff;border-radius:6px;
      padding:7px 14px;font-size:12.5px;font-weight:700
    }
    .qty .add{width:auto;min-width:58px}
    html[lang="ru"] .qty .add{min-width:82px}
    .remove{border:0;background:none;color:#C7C2B4;font-size:18px}
    @media(max-width:480px){
      .item{flex-direction:column}
      .qty{width:100%;max-width:none;justify-content:flex-end}
    }
    .custom-row{display:flex;gap:6px;margin-bottom:8px}
    .custom-row input{
      flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:0
    }
    .custom-row button{
      border:0;background:var(--ink);color:#fff;border-radius:6px;padding:0 14px;font-weight:700
    }
    body.checkout-open{overflow:hidden}
    .checkout-modal{
      position:fixed;
      inset:0;
      z-index:95;
      display:none;
      align-items:stretch;
      justify-content:flex-end;
      background:rgba(28,35,51,.56)
    }
    .checkout-modal.open{display:flex}
    .checkout-panel{
      width:min(820px,100%);
      height:100%;
      display:flex;
      flex-direction:column;
      background:#EFEFEF;
      box-shadow:-10px 0 34px rgba(28,35,51,.25)
    }
    .checkout-head{
      min-height:68px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:var(--ink);
      color:#fff
    }
    .checkout-head-copy strong{
      display:block;
      font-family:Arial Narrow,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-size:18px
    }
    .checkout-head-copy span{display:block;margin-top:3px;color:#AEB6C8;font-size:12px}
    .checkout-close{
      width:38px;height:38px;border:0;border-radius:8px;
      background:#2A3247;color:#fff;font-size:25px;line-height:1
    }
    .cart-sheet{
      background:#EFEFEF;
      flex:1;
      overflow:auto;
      padding:16px
    }
    .cart-list-group{
      margin-top:12px;
      border:1px solid #D2D2D2;
      border-radius:10px;
      position:relative;
      z-index:0;
      overflow:visible;
      background:rgba(255,255,255,.35)
    }
    .cart-list-group.menu-open{z-index:50}
    .cart-list-group:first-child{margin-top:8px}
    .cart-list-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:9px 11px;
      background:#E2E2E2;
      border-bottom:1px solid #D0D0D0;
      border-radius:9px 9px 0 0
    }
    .cart-list-name-editor{
      display:flex;
      align-items:center;
      gap:5px;
      flex:1;
      min-width:0
    }
    .cart-list-name-input{
      width:min(230px,100%);
      min-width:0;
      border:1px solid transparent;
      border-radius:6px;
      padding:3px 5px;
      background:transparent;
      color:var(--ink);
      font:900 13px/1.2 Arial,sans-serif;
      outline:0
    }
    .cart-list-name-input:hover{border-color:#C4C4C4;background:rgba(255,255,255,.45)}
    .cart-list-name-input:focus{border-color:#8C96A8;background:#fff}
    .cart-list-name-edit-icon{
      flex:0 0 auto;
      color:#7E8798;
      font-size:12px;
      pointer-events:none
    }
    .cart-list-subtotal{font-size:12px;font-weight:900;color:#3F4656}
    .cart-item{
      padding:8px 10px;
      border-bottom:1px solid #D4D4D4;
      background:transparent
    }
    .cart-item:last-child{border-bottom:0;border-radius:0 0 9px 9px}
    .cart-row{display:grid;grid-template-columns:18px 34px minmax(150px,1fr) auto auto 72px 66px 32px;align-items:center;gap:10px}
    .cart-item-controls{display:flex;align-items:center;gap:5px}
    .cart-item-controls button{
      width:28px;height:28px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900
    }
    .cart-qty-minus{border:1px solid var(--line);background:#FAFAF8}
    .cart-qty-plus{border:0;background:var(--yellow)}
    .cart-qty-value{min-width:18px;text-align:center;font-size:13px;font-weight:900}
    .cart-list-pick{
      display:flex;align-items:center;gap:3px;padding:3px;
      border:1px solid var(--line);border-radius:8px;background:#F5F4EF
    }
    .cart-list-pick button{
      width:25px;height:25px;border:0;border-radius:5px;
      background:transparent;color:var(--muted);font-size:11px;font-weight:900
    }
    .cart-list-pick button.selected{background:var(--ink);color:#fff}
    .cart-remove-item{
      width:30px;height:30px;border:1px solid var(--line);border-radius:7px;
      background:#FAFAF8;color:var(--orange);font-size:16px
    }
    @media(max-width:560px){
      .cart-row{grid-template-columns:18px 34px minmax(0,1fr) auto;gap:8px}
      .cart-list-pick{grid-column:3}
      .cart-item-controls{grid-column:4}
      .price-input{grid-column:3;width:88px}
      .cart-line-total{grid-column:4;min-width:62px}
      .cart-remove-item{grid-column:4;justify-self:end}
    }
    .check{
      width:18px;height:18px;border-radius:4px;border:2px solid #C7C2B4;
      display:flex;align-items:center;justify-content:center;flex-shrink:0
    }
    .check.done{background:var(--green);border-color:var(--green);color:#fff}
    .cart-photo-wrap{
      width:34px;height:34px;border-radius:7px;overflow:hidden;flex:0 0 34px;
      border:1px solid var(--line);background:#FAFAF8;display:flex;align-items:center;justify-content:center
    }
    .cart-photo{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
    .cart-copy{flex:1;min-width:0}
    .cart-name{font-size:14px}
    .cart-receipt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:var(--muted);margin-top:2px;line-height:1.2}
    .cart-name.done{text-decoration:line-through;opacity:.5}
    .cart-add-another{position:relative;width:max-content;max-width:100%;margin-top:5px}
    .cart-add-another-btn{
      border:0;
      background:transparent;
      color:#9B4C14;
      padding:0;
      font-size:11px;
      font-weight:900;
      cursor:pointer
    }
    .cart-add-another-btn:hover{text-decoration:underline}
    .cart-add-another-menu{
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      z-index:1000;
      display:none;
      min-width:148px;
      padding:7px;
      border:1px solid var(--line);
      border-radius:9px;
      background:#fff;
      box-shadow:0 8px 22px rgba(28,35,51,.18)
    }

function ruPlural(count,one,few,many){
  const value=Math.abs(Number(count))%100;
  const last=value%10;
  if(value>10 && value<20) return many;
  if(last===1) return one;
  if(last>=2 && last<=4) return few;
  return many;
}

function t(key,vars={}){
  const entry=I18N[state.language]?.[key]??I18N.en[key]??key;
  if(typeof entry==="function") return entry(vars);
  return String(entry).replace(/\{(\w+)\}/g,(_,name)=>vars[name]??"");
}

function setLanguage(language){
  const next=language==="ru"?"ru":"en";
  if(state.language===next){
    applyLanguage();
    return;
  }
  state.language=next;
  saveLocal();
  render();
}

function loadLocal(key, fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch{return fallback}
}
function saveLocal(){
  localStorage.setItem(LS.sheetCategories,JSON.stringify(state.categories));
  localStorage.setItem(LS.cart,JSON.stringify(state.cart));
  localStorage.setItem(LS.cart2,JSON.stringify(state.cart2));
  localStorage.setItem(LS.cart3,JSON.stringify(state.cart3));
  localStorage.setItem(LS.itemListSelection,JSON.stringify(state.itemListSelection));
  localStorage.setItem(LS.listNames,JSON.stringify(state.listNames));
  localStorage.setItem(LS.runningLowCollapsed,JSON.stringify(state.runningLowCollapsed));
  localStorage.setItem(LS.checked,JSON.stringify(state.checked));
  localStorage.setItem(LS.cartPrices,JSON.stringify(state.cartPrices));
  localStorage.setItem(LS.archived,JSON.stringify(state.archived));
  localStorage.setItem(LS.sheetArchiveItems,JSON.stringify(state.sheetArchiveItems));
  localStorage.setItem(LS.history,JSON.stringify(state.priceHistory));
  localStorage.setItem(LS.orders,JSON.stringify(state.orders));
  localStorage.setItem(LS.settings,JSON.stringify(state.settings));
  localStorage.setItem(LS.language,JSON.stringify(state.language));
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove("show"),1800);
}
function mainItems(){
  return state.categories.flatMap(c=>c.items.map(i=>{
    i.categoryId=c.id;
    i.categoryName=c.name;
    return i;
  }));
}
function allItems(){
  const byId=new Map(mainItems().map(item=>[item.id,item]));
  (state.sheetArchiveItems||[]).forEach(item=>byId.set(item.id,item));
  return [...byId.values()];
}
const legacyProductItems=loadLocal(LS.categories,LEGACY_PRODUCT_CATALOG)
  .flatMap(category=>(category.items||[]).map(item=>({
    id:item.id,
    name:item.name,
    itemNumber:receiptItemNumber(item),
    defaultInterval:item.defaultInterval
  })));
function isArchived(itemId){
  return Boolean(state.archived && state.archived[itemId]);
}
function productMatchKey(item){
  const itemNumber=receiptItemNumber(item);
  if(itemNumber) return `#${itemNumber}`;
  return `name:${String(item?.name||"").trim().toLowerCase()}`;
}
function isSheetArchiveProduct(item){
  if(!item) return false;
  if(item.source==="google-sheet-archive") return true;
  const key=productMatchKey(item);
  return (state.sheetArchiveItems||[]).some(archiveItem=>
    archiveItem.id===item.id || productMatchKey(archiveItem)===key
  );
}
function archivedProducts(){
  const products=[];
  const seen=new Set();

  (state.sheetArchiveItems||[]).forEach(item=>{
    const key=productMatchKey(item);
    seen.add(key);
    products.push({...item,archiveKind:"sheet"});
  });

  mainItems()
    .filter(item=>isArchived(item.id))
    .forEach(item=>{
      const key=productMatchKey(item);
      if(seen.has(key)) return;
      seen.add(key);
      products.push({...item,archiveKind:"manual"});
    });

  return products.sort((a,b)=>itemDisplayName(a).localeCompare(itemDisplayName(b),state.language));
}
function archiveProduct(itemId){
  const item=mainItems().find(product=>product.id===itemId);
  if(!item) return;
  state.archived[itemId]={
    archivedAt:new Date().toISOString(),
    name:item.name||"",
    itemNumber:item.itemNumber||receiptItemNumber(item)||""
  };
  delete state.cart[itemId];
  delete state.cart2[itemId];
  delete state.cart3[itemId];
  delete state.itemListSelection[itemId];
  delete state.checked[itemId];
  delete state.checked[`1|${itemId}`];
  delete state.checked[`2|${itemId}`];
  delete state.checked[`3|${itemId}`];
  delete state.cartPrices[itemId];
  if(activeDetailItemId===itemId) closeItemDetail();
  saveLocal();
  render();
  toast(t("movedToArchive",{name:itemDisplayName(item)}));
}
function restoreProduct(itemId){
  const item=allItems().find(product=>product.id===itemId);
  delete state.archived[itemId];
  saveLocal();
  render();
  toast(t("productRestored",{name:itemDisplayName(item)}));
}
function restoreAllProducts(){
  const count=Object.keys(state.archived||{}).length;
  state.archived={};
  saveLocal();
  render();
  toast(count?t("productsRestored",{count}):t("archiveEmpty"));
}

  const root=document.getElementById("archiveItems");
  const restoreAll=document.getElementById("restoreAllBtn");
  if(!root) return;
  if(restoreAll){
    restoreAll.disabled=!manuallyHidden.length;
    restoreAll.parentElement.classList.toggle("hidden",!manuallyHidden.length);
  }

  if(!items.length){
    root.innerHTML=`<div class="archive-empty">${escapeHtml(t("noArchive"))}</div>`;
    return;
  }

  root.innerHTML=items.map(item=>{
    const activeList=selectedList(item.id);
    const activeListQty=qty(item.id,activeList);
    const price=itemUnitPrice(item);
    return `
      <div class="archive-item" data-selected-list="${activeList}">
        ${imageHtml(item,true)}
        <div class="archive-item-copy">
          <button type="button" class="archive-item-name item-name-button" data-detail="${item.id}">${escapeHtml(itemDisplayName(item))}</button>
          <div class="archive-item-meta">

function applyDefaultPricing(){
  const items=allItems();
  items.forEach(item=>{
    const estimate=DEFAULT_ONLINE_PRICE_ESTIMATES[item.id];
    if(estimate){
      if(!item.itemNumber) item.itemNumber=estimate.itemNumber||"";
      if(!(Number(item.estimatedPrice)>0)) item.estimatedPrice=estimate.price;
      if(!item.priceSource) item.priceSource=estimate.source;
      if(!item.priceDate) item.priceDate=estimate.date;
    }
    const defaults=DEFAULT_PRICE_HISTORY[item.id]||[];
    if(defaults.length){
      const existing=state.priceHistory[item.id]||[];
      const byKey=new Map(existing.map(row=>[`${row.date}|${Number(row.price).toFixed(2)}`,row]));
      defaults.forEach(row=>byKey.set(`${row.date}|${Number(row.price).toFixed(2)}`,row));
      state.priceHistory[item.id]=[...byKey.values()].sort((a,b)=>b.date.localeCompare(a.date));
    }
  });
  saveLocal();
}
function itemUnitPrice(item){
  const sheetPrice=Number(item?.sheetPrice);
  if(Number.isFinite(sheetPrice)&&sheetPrice>0) return sheetPrice;
  const latest=sortedHistory(item?.id)[0]?.price;
  if(Number.isFinite(Number(latest))&&Number(latest)>0) return Number(latest);
  const estimate=Number(item?.estimatedPrice);
  return Number.isFinite(estimate)&&estimate>0?estimate:0;
}
function receiptEntries(item){
  if(Array.isArray(item.receipt)) return item.receipt.filter(Boolean);
  return item.receipt ? [item.receipt] : [];
}
function primaryReceipt(item){
  return receiptEntries(item)[0] || "";
}
function receiptSearchText(item){
  return receiptEntries(item).join(" ").toLowerCase();
}
function receiptLinesHtml(item, className="item-receipt"){
  return receiptEntries(item).map(line=>`<div class="${className}">${escapeHtml(line)}</div>`).join("");
}
function itemNumbersHtml(item, className="item-receipt"){
  const numbers=[...new Set(
    receiptEntries(item)
      .map(line=>{
        const match=String(line).match(/^\s*(\d+)/);
        return match ? match[1] : "";
      })
      .filter(Boolean)
  )];

  if(!numbers.length && item.itemNumber){
    numbers.push(String(item.itemNumber));
  }

  return numbers.length
    ? `<div class="${className}">${escapeHtml(t("itemNumberPrefix"))} ${numbers.map(escapeHtml).join(" / ")}</div>`
    : "";
}

function setQty(id,value,listNo=selectedList(id)){
  const list=Number(listNo);
  const cart=cartFor(list);
  const next=Math.max(0,Number(value)||0);

  if(next<=0) delete cart[id];
  else cart[id]=next;

  if(totalQty(id)<=0){
    delete state.cartPrices[id];
    delete state.checked[id];
    LIST_NUMBERS.forEach(number=>delete state.checked[checkedKey(number,id)]);
  }

  saveLocal();
  render();
  queueSync("setCart",{itemId:id,quantity:next,listNumber:list});
}
function sortedHistory(id){
  return [...(state.priceHistory[id]||[])].sort((a,b)=>b.date.localeCompare(a.date));
}
function priceBadge(id){
  const item=allItems().find(x=>x.id===id);
  const sheetPrice=Number(item?.sheetPrice);
  const h=sortedHistory(id);
  if(Number.isFinite(sheetPrice) && sheetPrice>0){
    const previous=h[0]?.price;
    let delta="";
    if(previous){
      const d=+(sheetPrice-previous).toFixed(2);
      if(Math.abs(d)>=.01) delta=` <span class="${d>0?"price-up":"price-down"}">${d>0?"↑":"↓"}$${Math.abs(d).toFixed(2)}</span>`;
    }
    return `<div class="price-badge">${escapeHtml(t("sheetPrice"))} $${sheetPrice.toFixed(2)}${delta}</div>`;
  }
  if(h.length){
    const latest=h[0],prev=h[1];
    let delta="";
    if(prev){
      const d=+(latest.price-prev.price).toFixed(2);
      if(Math.abs(d)>=.01) delta=` <span class="${d>0?"price-up":"price-down"}">${d>0?"↑":"↓"}$${Math.abs(d).toFixed(2)}</span>`;
    }
    return `<div class="price-badge">${escapeHtml(t("lastPaid"))} $${Number(latest.price).toFixed(2)}${delta}</div>`;
  }
  const estimate=Number(item?.estimatedPrice);
  if(Number.isFinite(estimate)&&estimate>0){
    return `<div class="price-badge">${escapeHtml(t("onlineEstimate"))} $${estimate.toFixed(2)}</div>`;
  }
  return "";
}

function getLastPurchaseDate(itemId){
  for(const order of [...state.orders].reverse()){
    if(order.items.some(x=>x.id===itemId)) return order.date;
  }
  const h=sortedHistory(itemId);
  return h[0]?.date||null;
}
function dayDiff(dateStr){
  const then=new Date(dateStr+"T00:00:00");
  return Math.floor((Date.now()-then.getTime())/86400000);
}
function getSuggestions(){
  return allItems()
    .filter(item=>!isArchived(item.id) && !isSheetArchiveProduct(item))
    .map(item=>{
      const last=getLastPurchaseDate(item.id);
      if(!last) return null;
      const elapsed=dayDiff(last);
      const interval=item.defaultInterval||14;
      const score=elapsed/interval;
      return {...item,elapsed,interval,score};
    })
    .filter(Boolean)
    .filter(x=>x.score>=.8 && !totalQty(x.id))
    .sort((a,b)=>b.score-a.score)
    .slice(0,6);
}

function getCheckoutRecommendations(){
  return allItems()
    .filter(item=>!isArchived(item.id) && !isSheetArchiveProduct(item) && !totalQty(item.id))
    .map(item=>{
      const last=getLastPurchaseDate(item.id);
      if(!last) return null;
      const elapsed=dayDiff(last);
      const interval=Number(item.defaultInterval)||14;
      return {...item,elapsed,interval,score:elapsed/interval};
    })
    .filter(Boolean)
    .filter(item=>item.score>=.65)
    .sort((a,b)=>b.score-a.score || a.interval-b.interval);
}

function normalizeImageUrl(value){
  let url=String(value||"").trim();
  if(!url) return "";
  const imageFormula=url.match(/^=IMAGE\(\s*["']([^"']+)["']/i);
  if(imageFormula) url=imageFormula[1];
  const hyperlinkFormula=url.match(/^=HYPERLINK\(\s*["']([^"']+)["']/i);
  if(hyperlinkFormula) url=hyperlinkFormula[1];
  url=url.replace(/&amp;/gi,"&").trim();

  try{
    const parsed=new URL(url);
    if(parsed.protocol!=="https:" && parsed.protocol!=="http:") return "";

    /* The sheet stores Dropbox share links. Convert them at runtime to
       direct image links; no product-specific image URLs live in this HTML. */
    if(/(^|\.)dropbox\.com$/i.test(parsed.hostname)){
      parsed.hostname="dl.dropboxusercontent.com";
      parsed.searchParams.delete("dl");
      parsed.searchParams.delete("raw");
      return parsed.href;
    }

    /* Also accept ordinary Google Drive share links placed in the same cell. */
    if(parsed.hostname==="drive.google.com"){
      const fileMatch=parsed.pathname.match(/\/file\/d\/([^/]+)/i);
      const fileId=fileMatch?.[1]||parsed.searchParams.get("id");
      if(fileId){
        return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(fileId)}`;
      }
    }

    return parsed.href;
  }catch{
    return "";
  }
}

function normalizeProductLink(value){
  let link=String(value??"").trim();
  if(!link) return "";

  const hyperlinkFormula=link.match(/^=HYPERLINK\(\s*["']([^"']+)["']/i);
  if(hyperlinkFormula) link=hyperlinkFormula[1];

  try{
    const url=new URL(link);
    if(url.protocol!=="https:" && url.protocol!=="http:") return "";
    return url.href;
  }catch{
    return "";
  }
}
function itemImageData(item){
  const configured=item.imageUrl || "";
  if(!configured) return {src:"",fallback:""};
  if(typeof configured==="string") return {src:normalizeImageUrl(configured),fallback:""};
  return {src:normalizeImageUrl(configured.src||""),fallback:normalizeImageUrl(configured.fallback||"")};
}
function imageHtml(item,cart=false){

  return `<div class="${wrapClass}">

function spreadsheetIdFromUrl(value){

  const match=text.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return match?match[1]:text;

function parseCost(value){
  if(typeof value==="number") return value;
  const n=parseFloat(String(value||"").replace(/[$,]/g,""));
  return Number.isFinite(n)?n:null;
}
function parseCsv(text){
  const rows=[];
  let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"' && quoted && next==='"'){cell+='"';i++;continue}
    if(ch==='"'){quoted=!quoted;continue}
    if(ch===',' && !quoted){row.push(cell);cell="";continue}
    if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r'&&next==='\n') i++;
      row.push(cell);cell="";
      if(row.some(v=>String(v).trim()!=="")) rows.push(row);
      row=[];continue;
    }
    cell+=ch;
  }
  row.push(cell);
  if(row.some(v=>String(v).trim()!=="")) rows.push(row);
  if(!rows.length) return [];
  const headers=rows[0].map(x=>String(x).trim());
  return rows.slice(1).map(r=>({
    ...Object.fromEntries(headers.map((h,i)=>[h,r[i]??""])),
    __cells:r
  }));
}
function parseGviz(text){
  const first=text.indexOf("{");
  const last=text.lastIndexOf("}");
  if(first<0||last<first) throw new Error("Invalid Google Sheet response");
  const data=JSON.parse(text.slice(first,last+1));
  const table=data.table||{};
  const headers=(table.cols||[]).map((c,i)=>String(c.label||c.id||`Column ${i+1}`).trim());
  return (table.rows||[]).map(row=>{
    const obj={};
    const cells=[];
    headers.forEach((header,i)=>{
      const cell=row.c?.[i];
      const value=cell?.v??cell?.f??"";
      obj[header]=value;
      cells.push(value);
    });
    obj.__cells=cells;
    return obj;
  });
}
async function fetchPublicSheetRows(tabOverride="",gidOverride="",{preferCsv=false}={}){
  const id=spreadsheetIdFromUrl(CONFIG.GOOGLE_SHEET_URL);
  const tab=tabOverride||CONFIG.GOOGLE_SHEET_TAB||"Items";
  const gid=gidOverride||CONFIG.GOOGLE_SHEET_GID||"0";
  if(!id) throw new Error("Spreadsheet ID is missing");

  if(!preferCsv){
    const gviz=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}&headers=1&_=${Date.now()}`;
    try{
      const res=await fetch(gviz,{cache:"no-store",credentials:"omit"});
      if(!res.ok) throw new Error("Google Visualization request failed");
      const rows=parseGviz(await res.text());
      if(rows.length) return rows;
    }catch(error){console.warn("GViz load failed",error)}
  }

  const csv=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/export?format=csv&gid=${encodeURIComponent(gid)}&_=${Date.now()}`;
  const res=await fetch(csv,{cache:"no-store",credentials:"omit"});
  if(!res.ok) throw new Error("Google Sheet CSV request failed");
  return parseCsv(await res.text());
}
function sheetValue(row,names){
  const keys=Object.keys(row||{});
  let firstMatchedValue="";

  for(const name of names){
    const key=keys.find(k=>String(k).trim().toLowerCase()===String(name).trim().toLowerCase());
    if(key===undefined) continue;

    const value=row[key];
    if(firstMatchedValue==="") firstMatchedValue=value;

    if(value!==null && value!==undefined && String(value).trim()!==""){
      return value;
    }
  }

  return firstMatchedValue||"";
}
function receiptItemNumber(item){
  const direct=String(item.itemNumber||"").trim();
  if(direct) return direct;
  const match=primaryReceipt(item).match(/^\s*(\d+)/);
  return match?match[1]:"";
}
function slugify(value){
  return String(value||"item").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||`item-${Date.now()}`;
}
function normalizeTag(value){
  const tag=String(value||"")
    .trim()
    .replace(/^#+/,"")
    .replace(/\s+/g," ")
    .toLowerCase();
  return tag?`#${tag}`:"";
}
function parseTags(value){
  return [...new Set(
    String(value||"")
      .split(/[,;\n|]+/)
      .map(normalizeTag)
      .filter(Boolean)
  )];
}
function itemTags(item){
  const values=Array.isArray(item?.tags)?item.tags:parseTags(item?.tags);
  return [...new Set(values.map(normalizeTag).filter(Boolean))];
}
function availableTags(){

function cleanProductRows(rows,{archiveLayout=false}={}){
  return (rows||[]).map(row=>{
    const cells=Array.isArray(row?.__cells)?row.__cells:[];
    const namedCategory=sheetValue(row,["Category"]);
    const namedCost=sheetValue(row,["Cost","Price"]);
    const tailCategory=archiveLayout && cells.length>=2 ? cells[cells.length-2] : "";
    const tailCost=archiveLayout && cells.length ? cells[cells.length-1] : "";
    const parsedNamedCost=parseCost(namedCost);
    return {
    name:String(sheetValue(row,["Item","Name","Product"] )||"").trim(),
    rusName:String(sheetValue(row,["Item Rus","Rus","Russian","Russian Name"])||"").trim(),
    itemNumber:String(sheetValue(row,["#","Item #","Item Number","SKU"] )||"").replace(/\.0$/,"" ).trim(),
    cost:parsedNamedCost!==null?parsedNamedCost:parseCost(tailCost),
    pic:normalizeImageUrl(sheetValue(row,["Pic Dropbox","Dropbox Pic","Pic URL","Pic","Picture","Image","Image URL","Photo"])),
    weight:String(sheetValue(row,["Weight","Size","Unit"] )||"").trim(),
    link:normalizeProductLink(sheetValue(row,["Link","Product Link","Costco Link","Official Link","Website","URL"])),
    tags:parseTags(sheetValue(row,["Tag","Tags"])),
    category:String(namedCategory||tailCategory||"").trim()
    };
  }).filter(r=>r.name||r.itemNumber);
}
function replaceProductsFromRows(rows){
  const cleanRows=cleanProductRows(rows);
  const existing=[...mainItems(),...legacyProductItems];
  const categories=[];
  const categoriesByName=new Map();
  const usedIds=new Set();
  let updated=0,added=0;

  cleanRows.forEach(row=>{
    const itemNumber=row.itemNumber;
    let item=existing.find(x=>itemNumber && receiptItemNumber(x)===itemNumber);
    if(!item) item=existing.find(x=>x.name.toLowerCase()===row.name.toLowerCase());
    const categoryName=row.category||"Uncategorized";
    const categoryKey=categoryName.toLowerCase();
    let cat=categoriesByName.get(categoryKey);
    if(!cat){
      cat={id:`sheet-category-${slugify(categoryName)}`,name:categoryName,items:[]};
      categoriesByName.set(categoryKey,cat);
      categories.push(cat);
    }
    const baseId=item?.id||`sheet-${itemNumber||slugify(row.name)}`;
    let id=baseId;
    let duplicateNo=2;
    while(usedIds.has(id)) id=`${baseId}-${duplicateNo++}`;
    usedIds.add(id);
    const created={
      id,
      name:row.name||`Costco Item ${itemNumber}`,
      rusName:row.rusName||item?.rusName||"",
      itemNumber,
      receipt:itemNumber?[`${itemNumber} - ${(row.name||"ITEM").toUpperCase()}`]:[],
      unit:row.weight||"pc",
      weight:row.weight,
      productLink:row.link,
      tags:row.tags.length?row.tags:itemTags(item),
      sheetPrice:row.cost,
      priceSource:row.cost!==null?"sheet":"",
      imageUrl:row.pic,
      imageSource:row.pic?"Google Sheet: Pic Dropbox":"",
      defaultInterval:Number(item?.defaultInterval)||14,
      source:"google-sheet"
    };
    cat.items.push(created);
    if(item) updated++;
    else added++;
  });
  state.categories=categories;
  localStorage.removeItem(LS.categories);
  saveLocal();
  return {rows:cleanRows.length,updated,added};
}
function replaceArchiveProductsFromRows(rows){
  const cleanRows=cleanProductRows(rows,{archiveLayout:true});

  state.sheetArchiveItems=cleanRows.map(row=>{
    const itemNumber=row.itemNumber;
    let existing=existingMain.find(item=>itemNumber && receiptItemNumber(item)===itemNumber);
    if(!existing && row.name){
      existing=existingMain.find(item=>String(item.name||"").toLowerCase()===row.name.toLowerCase());
    }

    const id=existing?.id||`sheet-archive-${itemNumber||slugify(row.name)}`;
    const categoryName=row.category||existing?.categoryName||"Archive";
    return {
      ...(existing||{}),
      id,
      name:row.name||existing?.name||`Costco Item ${itemNumber}`,
      rusName:row.rusName||existing?.rusName||"",
      itemNumber:itemNumber||existing?.itemNumber||"",
      receipt:itemNumber?[`${itemNumber} - ${(row.name||existing?.name||"ITEM").toUpperCase()}`]:(existing?.receipt||[]),
      unit:row.weight||existing?.unit||"pc",
      weight:row.weight||existing?.weight||"",
      productLink:row.link||existing?.productLink||"",
      tags:row.tags.length?row.tags:itemTags(existing),
      sheetPrice:row.cost!==null?row.cost:existing?.sheetPrice,
      priceSource:row.cost!==null?"sheet":(existing?.priceSource||""),
      imageUrl:row.pic||existing?.imageUrl||"",
      imageSource:row.pic?"Google Sheet: Archive":(existing?.imageSource||""),

      categoryId:"sheet-archive",

async function loadFromSheet(){

  const archiveTab=CONFIG.GOOGLE_SHEET_ARCHIVE_TAB||"Archive";

function saveOrder(){
  const items=[];

  LIST_NUMBERS.forEach(listNo=>{
    allItems().filter(item=>qty(item.id,listNo)>0).forEach(item=>{
      const stored=state.cartPrices[item.id];
      const price=stored!==undefined&&stored!==""?(parseFloat(stored)||0):itemUnitPrice(item);

      items.push({
        id:item.id,
        name:item.name,
        itemNumber:receiptItemNumber(item),
        receipt:receiptEntries(item),
        qty:qty(item.id,listNo),
        list:listNo,
        unit:item.unit,
        weight:item.weight||"",
        imageUrl:itemImageData(item).src||"",
        price:price||null
      });
    });
  });

  if(!items.length) return;

  const date=new Date().toISOString().slice(0,10);
  const pricesSaved=new Set();

  items.forEach(item=>{
    if(!item.price || pricesSaved.has(item.id)) return;
    pricesSaved.add(item.id);

    state.priceHistory[item.id]=state.priceHistory[item.id]||[];
    const old=state.priceHistory[item.id].find(row=>row.date===date);
    if(old) old.price=item.price;
    else state.priceHistory[item.id].push({date,price:item.price});
  });

  const order={id:"order-"+Date.now(),date,items};
  state.orders.push(order);
  saveLocal();
  queueSync("saveOrder",order);
  toast(t("orderSaved"));
  render();
}

let pdfMakeLoaderPromise=null;
function loadExternalScript(src){
  return new Promise((resolve,reject)=>{
    const existing=document.querySelector(`script[data-pdf-src="${src}"]`);
    if(existing){
      if(existing.dataset.loaded==="true"){resolve();return}
      existing.addEventListener("load",resolve,{once:true});
      existing.addEventListener("error",reject,{once:true});
      return;
    }

    const script=document.createElement("script");
    script.src=src;
    script.async=true;
    script.dataset.pdfSrc=src;
    script.addEventListener("load",()=>{
      script.dataset.loaded="true";
      resolve();
    },{once:true});
    script.addEventListener("error",()=>{
      script.remove();
      reject(new Error(`Could not load ${src}`));
    },{once:true});
    document.head.appendChild(script);
  });
}
async function loadPdfMake(){
  if(globalThis.pdfMake?.createPdf) return globalThis.pdfMake;
  if(!pdfMakeLoaderPromise){
    pdfMakeLoaderPromise=(async()=>{
      await loadExternalScript("https://cdn.jsdelivr.net/npm/pdfmake@0.3.9/build/pdfmake.min.js");
      await loadExternalScript("https://cdn.jsdelivr.net/npm/pdfmake@0.3.9/build/vfs_fonts.js");
      if(!globalThis.pdfMake?.createPdf) throw new Error("PDF library did not initialize");
      return globalThis.pdfMake;
    })().catch(error=>{
      pdfMakeLoaderPromise=null;
      throw error;
    });
  }
  return pdfMakeLoaderPromise;
}

      columns:[
        {text:t("pdfEstimatedTotal"),style:"grandTotalLabel"},
        {text:`$${report.grandTotal.toFixed(2)}`,style:"grandTotal"}
      ]

    {
      text:t("pdfNote"),
      style:"note",
      margin:[0,9,0,0]
    }
  );

  return {
    info:{

      subject:t("pdfSubject")
    },
    pageSize:"LETTER",

      color:"#818898",
      fontSize:8,
      margin:[0,14,0,0]
    }),
    defaultStyle:{

}
async function saveCartPdf(){
  const report=cartPdfData();
  if(!report.itemCount){
    toast(t("emptyCart"));
    return;
  }

  const button=document.getElementById("savePdfBtn");
  const oldLabel=button.textContent;
  button.disabled=true;
  button.textContent=t("preparing");

  try{
    const pdfMake=await loadPdfMake();
    const now=new Date();
    const fileDate=[
      now.getFullYear(),
      String(now.getMonth()+1).padStart(2,"0"),
      String(now.getDate()).padStart(2,"0")
    ].join("-");
    const dateLabel=now.toLocaleDateString(state.language==="ru"?"ru-RU":"en-US",{
      year:"numeric",
      month:"long",
      day:"numeric"
    });
    await pdfMake
      .createPdf(cartPdfDocument(report,dateLabel))
      .download(`POKPOK-Cart-${fileDate}.pdf`);
    toast(t("pdfSaved"));
  }catch(error){
    console.error("PDF generation failed",error);
    toast(t("pdfFailed"));
  }finally{
    button.disabled=false;
    button.textContent=t("savePdf");
  }
}
function clearCart(){
  state.cart={};
  state.cart2={};
  state.cart3={};
  state.checked={};
  state.cartPrices={};
  saveLocal();
  render();
  queueSync("clearCart",{allLists:true});
}
function productNumber(item){
  if(item.itemNumber) return String(item.itemNumber);
  const receipt=primaryReceipt(item);
  const match=receipt.match(/^\s*([0-9]+)\s*-/);
  return match?match[1]:"";
}
function currentPriceSource(item,hist){
  const sheetPrice=Number(item.sheetPrice);
  if(Number.isFinite(sheetPrice)&&sheetPrice>0) return t("googleSheetPrice");
  if(hist.length) return t("latestReceiptPrice");
  if(Number(item.estimatedPrice)>0) return t("onlinePriceEstimate");
  return t("priceNotAvailable");
}
function drawerImageHtml(item){
  const image=itemImageData(item);
  if(!image.src){
    return `<div class="drawer-image-wrap"><span class="drawer-image-fallback">🛒</span></div>`;
  }
  return `<div class="drawer-image-wrap">
    <img class="drawer-image"
      src="${escapeHtml(image.src)}"
      data-fallback="${escapeHtml(image.fallback)}"
      alt="${escapeHtml(itemDisplayName(item))}"
      referrerpolicy="no-referrer"
      onerror="
        if(this.dataset.fallback && !this.dataset.fallbackUsed){
          this.dataset.fallbackUsed='1';
          this.src=this.dataset.fallback;
        }else{
          this.style.display='none';
          this.nextElementSibling.style.display='inline';
        }
      ">
    <span class="drawer-image-fallback" style="display:none">🛒</span>
  </div>`;
}
function productLinkHtml(item){
  const link=normalizeProductLink(item.productLink||item.link||"");

  if(!link){
    return `<div class="drawer-link-missing">${escapeHtml(t("noOfficialLink"))}</div>`;
  }

  let label=t("viewOfficialPage");
  try{
    const hostname=new URL(link).hostname.toLowerCase();
    if(hostname.includes("costco")) label=t("viewOnCostco");
  }catch{}

  return `<a
    class="drawer-product-link"
    href="${escapeHtml(link)}"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="drawer-product-link-icon">↗</span>
    <span>${escapeHtml(label)}</span>
  </a>`;
}
function renderProductDrawer(itemId){
  const item=allItems().find(x=>x.id===itemId);
  if(!item){closeItemDetail();return}

  const hist=sortedHistory(itemId);
  const currentPrice=itemUnitPrice(item);
  const avg=hist.length?hist.reduce((sum,row)=>sum+Number(row.price||0),0)/hist.length:null;
  const min=hist.length?Math.min(...hist.map(row=>Number(row.price||0))):null;
  const max=hist.length?Math.max(...hist.map(row=>Number(row.price||0))):null;
  const latest=hist[0]||null;
  const receipts=receiptEntries(item);
  const itemNo=productNumber(item);
  const activeList=selectedList(item.id);
  const quantity=qty(item.id,activeList);
  const allListsSummary=listSummaryText(item.id);
  const lastPurchase=getLastPurchaseDate(item.id);
  const interval=Number(item.defaultInterval)||null;
  const priceSource=currentPriceSource(item,hist);

  const historyHtml=hist.length
    ? hist.map(row=>`<div class="drawer-history-row"><span>${escapeHtml(row.date)}</span><strong>$${Number(row.price).toFixed(2)}</strong></div>`).join("")
    : `<div class="small">${escapeHtml(t("noPriceHistory"))}</div>`;

  const receiptHtml=receipts.length
    ? receipts.map(line=>`<div class="drawer-receipt">${escapeHtml(line)}</div>`).join("")
    : `<div class="small">${escapeHtml(t("noReceiptName"))}</div>`;

  document.getElementById("productDrawer").dataset.selectedList=String(activeList);
  document.getElementById("productDrawerContent").innerHTML=`
    ${drawerImageHtml(item)}
    <h2 class="drawer-product-name">${escapeHtml(itemDisplayName(item))}</h2>
    <div class="drawer-category">${escapeHtml(categoryDisplayName(item.categoryName))}</div>

    <div class="drawer-price">${currentPrice>0?`$${currentPrice.toFixed(2)}`:"—"}</div>
    <div class="drawer-price-source">${escapeHtml(priceSource)}${item.priceDate?` · ${escapeHtml(item.priceDate)}`:""}</div>
    ${productLinkHtml(item)}

    <section class="drawer-section">
      <div class="drawer-section-title">${escapeHtml(t("productInformation"))}</div>
      <div class="drawer-detail-grid">
        <div class="drawer-detail-label">${escapeHtml(t("itemNumber"))}</div>
        <div class="drawer-detail-value">${itemNo?escapeHtml(itemNo):"—"}</div>

        <div class="drawer-detail-label">${escapeHtml(t("category"))}</div>
        <div class="drawer-detail-value">${escapeHtml(categoryDisplayName(item.categoryName))}</div>

        <div class="drawer-detail-label">${escapeHtml(t("weightSize"))}</div>
        <div class="drawer-detail-value">${escapeHtml(item.weight||item.unit||"—")}</div>

        <div class="drawer-detail-label">${escapeHtml(t("cartQuantity"))}</div>
        <div class="drawer-detail-value">${quantity}</div>

        <div class="drawer-detail-label">${escapeHtml(t("lastPurchase"))}</div>
        <div class="drawer-detail-value">${lastPurchase?escapeHtml(lastPurchase):"—"}</div>

        <div class="drawer-detail-label">${escapeHtml(t("buyInterval"))}</div>
        <div class="drawer-detail-value">${interval?escapeHtml(t("everyDays",{count:interval})):"—"}</div>
      </div>
    </section>

    <section class="drawer-section">
      <div class="drawer-section-title">${escapeHtml(t("receiptName"))}</div>
      ${receiptHtml}
    </section>

    <section class="drawer-section">
      <div class="drawer-section-title">${escapeHtml(t("priceSummary"))}</div>
      <div class="drawer-stats">
        <div class="drawer-stat"><span>${escapeHtml(t("currentPrice"))}</span><strong>${currentPrice>0?`$${currentPrice.toFixed(2)}`:"—"}</strong></div>
        <div class="drawer-stat"><span>${escapeHtml(t("lastPaidLabel"))}</span><strong>${latest?`$${Number(latest.price).toFixed(2)}`:"—"}</strong></div>
        <div class="drawer-stat"><span>${escapeHtml(t("average"))}</span><strong>${avg!==null?`$${avg.toFixed(2)}`:"—"}</strong></div>
        <div class="drawer-stat"><span>${escapeHtml(t("lowest"))}</span><strong>${min!==null?`$${min.toFixed(2)}`:"—"}</strong></div>
        <div class="drawer-stat"><span>${escapeHtml(t("highest"))}</span><strong>${max!==null?`$${max.toFixed(2)}`:"—"}</strong></div>
        <div class="drawer-stat"><span>${escapeHtml(t("records"))}</span><strong>${hist.length}</strong></div>
      </div>
    </section>

    <section class="drawer-section">
      <div class="drawer-section-title">${escapeHtml(t("priceHistory"))}</div>
      ${historyHtml}
    </section>

    <div class="drawer-quantity">
      <div class="drawer-list-tools">
        <div style="font-size:12px;color:var(--muted)">${escapeHtml(t("shoppingList",{number:activeList}))}</div>
        <div class="drawer-list-pick">
          ${LIST_NUMBERS.map(listNo=>`
            <button
              type="button"
              class="${activeList===listNo?"selected":""}"
              data-list-select="${item.id}|${listNo}"
              data-list-number="${listNo}"
              aria-label="${escapeHtml(t("chooseListNumber",{number:listNo}))}"
            >${listNo}</button>
          `).join("")}
        </div>
        <strong>${quantity?`${quantity} ${escapeHtml(item.unit||"")}`:escapeHtml(t("notAdded"))}</strong>
        ${allListsSummary?`<div class="drawer-list-summary">${escapeHtml(allListsSummary)}</div>`:""}
      </div>
      <div class="drawer-qty-controls">
        <button type="button" class="drawer-qty-minus" data-drawer-minus="${item.id}" aria-label="${escapeHtml(t("decreaseList",{number:activeList}))}">−</button>
        <span class="drawer-qty-value">${quantity}</span>
        <button type="button" class="drawer-qty-plus" data-drawer-plus="${item.id}" aria-label="${escapeHtml(t("increaseList",{number:activeList}))}">+</button>
      </div>
    </div>
  `;
}
function showItemDetail(itemId){
  activeDetailItemId=itemId;
  renderProductDrawer(itemId);
  document.getElementById("productDrawer").classList.add("open");
  document.getElementById("productDrawerBackdrop").classList.add("open");
  document.body.classList.add("drawer-open");
}
function closeItemDetail(){
  activeDetailItemId=null;
  document.getElementById("productDrawer").classList.remove("open");
  document.getElementById("productDrawerBackdrop").classList.remove("open");
  document.body.classList.remove("drawer-open");
}

document.addEventListener("click",e=>{
  const t=e.target;
  const categoryFilterOption=t.closest("[data-category-filter]");
  if(categoryFilterOption){
    state.categoryFilter=categoryFilterOption.dataset.categoryFilter;
    renderCategories();
    renderCategoryFilter();
    return;
  }
  const tagFilterOption=t.closest("[data-tag-filter]");
  if(tagFilterOption){
    const tag=normalizeTag(tagFilterOption.dataset.tagFilter);
    const selectedTags=new Set((state.tagFilters||[]).map(normalizeTag).filter(Boolean));
    if(selectedTags.has(tag)) selectedTags.delete(tag);
    else selectedTags.add(tag);
    state.tagFilters=[...selectedTags];
    renderCategories();
    renderCategoryFilter();
    return;
  }
  if(t.closest("#clearTagFiltersBtn")){
    state.tagFilters=[];
    renderCategories();
    renderCategoryFilter();
    return;
  }
  const cartAddMenuButton=t.closest("[data-cart-add-menu]");
  if(cartAddMenuButton){
    const wrap=cartAddMenuButton.closest(".cart-add-another");
    const willOpen=!wrap.classList.contains("open");
    document.querySelectorAll(".cart-add-another.open").forEach(element=>{
      element.classList.remove("open");
      element.classList.remove("open-up");
      element.closest(".cart-list-group")?.classList.remove("menu-open");
      element.querySelector("[data-cart-add-menu]")?.setAttribute("aria-expanded","false");
    });
    if(willOpen){
      const sheetRect=cartAddMenuButton.closest(".cart-sheet")?.getBoundingClientRect();
      const buttonRect=cartAddMenuButton.getBoundingClientRect();
      wrap.classList.toggle("open-up",Boolean(sheetRect && sheetRect.bottom-buttonRect.bottom<110));
      wrap.classList.add("open");
      wrap.closest(".cart-list-group")?.classList.add("menu-open");
      cartAddMenuButton.setAttribute("aria-expanded","true");
    }
    return;
  }
  const cartAddToButton=t.closest("[data-cart-add-to]");
  if(cartAddToButton){
    const parts=cartAddToButton.dataset.cartAddTo.split("|");
    parts.shift();
    const targetList=Number(parts.pop());
    const itemId=parts.join("|");
    const item=allItems().find(product=>product.id===itemId);
    if(item && LIST_NUMBERS.includes(targetList)){
      state.itemListSelection[itemId]=targetList;
      setQty(itemId,qty(itemId,targetList)+1,targetList);
      toast(t("addedToList",{name:itemDisplayName(item),number:targetList}));
    }
    return;
  }
  if(!t.closest(".cart-add-another")){
    document.querySelectorAll(".cart-add-another.open").forEach(element=>{
      element.classList.remove("open");
      element.classList.remove("open-up");
      element.closest(".cart-list-group")?.classList.remove("menu-open");
      element.querySelector("[data-cart-add-menu]")?.setAttribute("aria-expanded","false");
    });
  }
  if(t.dataset.plus) setQty(t.dataset.plus,qty(t.dataset.plus)+1);
  if(t.dataset.minus) setQty(t.dataset.minus,qty(t.dataset.minus)-1);
  if(t.dataset.check){
    const [listText,...idParts]=t.dataset.check.split("|");
    const listNo=Number(listText);
    const itemId=idParts.join("|");
    const key=checkedKey(listNo,itemId);
    state.checked[key]=!isChecked(listNo,itemId);
    if(listNo===1) delete state.checked[itemId];
    saveLocal();
    renderCart();
  }
  if(t.dataset.addSuggestion){
    const itemId=t.dataset.addSuggestion;
    const listNo=selectedList(itemId);
    setQty(itemId,qty(itemId,listNo)+1,listNo);
  }
  if(t.dataset.recommendationPage!==undefined){
    const page=Number(t.dataset.recommendationPage);
    if(Number.isInteger(page) && page>=0){
      state.checkoutRecommendationsPage=page;
      renderCheckoutRecommendations();
    }
    return;
  }
  if(t.dataset.checkoutRecommendation){
    const itemId=t.dataset.checkoutRecommendation;
    const item=allItems().find(product=>product.id===itemId);
    const listNo=selectedList(itemId);
    setQty(itemId,qty(itemId,listNo)+1,listNo);
    if(item) toast(t("addedToList",{name:itemDisplayName(item),number:listNo}));
  }
  if(t.dataset.cartPlus){
    const [listText,...idParts]=t.dataset.cartPlus.split("|");
    const listNo=Number(listText);
    const itemId=idParts.join("|");
    setQty(itemId,qty(itemId,listNo)+1,listNo);
  }
  if(t.dataset.cartMinus){
    const [listText,...idParts]=t.dataset.cartMinus.split("|");
    const listNo=Number(listText);
    const itemId=idParts.join("|");
    setQty(itemId,qty(itemId,listNo)-1,listNo);
  }
  if(t.dataset.cartRemove){
    const [listText,...idParts]=t.dataset.cartRemove.split("|");
    const listNo=Number(listText);
    const itemId=idParts.join("|");
    setQty(itemId,0,listNo);
  }
  if(t.dataset.cartMove){
    const parts=t.dataset.cartMove.split("|");
    const sourceList=Number(parts.shift());
    const targetList=Number(parts.pop());
    const itemId=parts.join("|");
    if(sourceList!==targetList && LIST_NUMBERS.includes(targetList)){
      const movingQty=qty(itemId,sourceList);
      const combinedQty=qty(itemId,targetList)+movingQty;
      delete cartFor(sourceList)[itemId];
      cartFor(targetList)[itemId]=combinedQty;
      state.itemListSelection[itemId]=targetList;
      delete state.checked[checkedKey(sourceList,itemId)];
      saveLocal();
      render();
      queueSync("setCart",{itemId,quantity:0,listNumber:sourceList});
      queueSync("setCart",{itemId,quantity:combinedQty,listNumber:targetList});
    }
  }
  if(t.dataset.listSelect){
    const [itemId,listNo]=t.dataset.listSelect.split("|");
    setSelectedList(itemId,Number(listNo));
  }
  if(t.dataset.detail) showItemDetail(t.dataset.detail);
  if(t.dataset.drawerPlus) setQty(t.dataset.drawerPlus,qty(t.dataset.drawerPlus)+1);
  if(t.dataset.drawerMinus) setQty(t.dataset.drawerMinus,qty(t.dataset.drawerMinus)-1);
  if(t.dataset.closeDrawer) closeItemDetail();

  if(t.dataset.archive) archiveProduct(t.dataset.archive);
  if(t.dataset.restore) restoreProduct(t.dataset.restore);
  if(t.dataset.close){
    document.getElementById(t.dataset.close).classList.remove("open");
    if(t.dataset.close==="categoryFilterPanel"){
      setCategoryFilterOpen(false);
    }
  }
});

document.getElementById("cartItems").addEventListener("input",e=>{
  if(e.target.dataset.listName){
    const listNo=Number(e.target.dataset.listName);
    if(LIST_NUMBERS.includes(listNo)){
      state.listNames[listNo]=e.target.value;
      saveLocal();
    }
    return;
  }
  if(e.target.dataset.price){
    const itemId=e.target.dataset.price;
    state.cartPrices[itemId]=e.target.value;
    document.querySelectorAll("[data-price]").forEach(input=>{
      if(input!==e.target && input.dataset.price===itemId) input.value=e.target.value;
    });
    saveLocal();
    updateCartTotal();
  }
});
document.getElementById("cartItems").addEventListener("focusout",e=>{
  if(!e.target.dataset.listName) return;
  const listNo=Number(e.target.dataset.listName);
  if(!LIST_NUMBERS.includes(listNo)) return;
  const normalized=String(e.target.value||"").trim()||defaultListName(listNo);
  state.listNames[listNo]=normalized;
  e.target.value=normalized;
  saveLocal();
});
document.getElementById("cartItems").addEventListener("keydown",e=>{
  if(e.target.dataset.listName && e.key==="Enter"){

    e.target.blur();

});

document.addEventListener("keydown",e=>{

  else if(e.key==="Escape" && document.getElementById("categoryFilterPanel").classList.contains("open")){

  }
});

applyDefaultPricing();
render();
loadFromSheet();
setTimeout(()=>loadPdfMake().catch(error=>console.warn("PDF library preload failed",error)),0);
