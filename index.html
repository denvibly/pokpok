<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1C2333" />
  <title>POKPOK</title>
  <style>
    :root{
      --ink:#1C2333;
      --bg:#F4F3EF;
      --yellow:#F2B705;
      --orange:#E1550B;
      --green:#2F7A4D;
      --line:#DAD7CC;
      --muted:#8A8F9C;
      --card:#FFFFFF;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{
      width:795px;
      max-width:100%;
      min-height:100vh;
      margin:0 auto;
      background:var(--bg)
    }
    .topbar{
      position:sticky;top:0;z-index:20;
      background:var(--ink);
      padding:18px 15px 14px;
      box-shadow:0 2px 12px rgba(0,0,0,.12);
    }
    .title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title{
      color:#fff;font-family:Arial Narrow,Arial,sans-serif;
      text-transform:uppercase;font-size:24px;font-weight:900;letter-spacing:.5px
    }
    .cart-summary-btn{
      border:0;
      background:var(--yellow);
      color:var(--ink);
      min-height:40px;
      padding:7px 11px;
      border-radius:8px;
      display:flex;
      align-items:center;
      gap:9px;
      font-size:12px;
      font-weight:900
    }
    .cart-summary-icon{font-size:19px;line-height:1}
    .cart-summary-count{
      min-width:22px;
      height:22px;
      padding:0 6px;
      border-radius:11px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:var(--ink);
      color:#fff;
      font-size:11px
    }
    .cart-summary-total{
      padding-left:9px;
      border-left:1px solid rgba(28,35,51,.25);
      white-space:nowrap
    }
    .cart-summary-btn:disabled{opacity:.55;cursor:default}
    .top-actions{display:flex;gap:8px;margin-top:12px}
    .search{
      flex:1;display:flex;align-items:center;gap:8px;
      background:#2A3247;border-radius:8px;padding:9px 10px
    }
    .search input{
      width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:14px
    }
    .search input::placeholder{color:#8A93A8}
    .icon-btn{
      border:0;border-radius:8px;padding:0 12px;min-width:42px;
      display:flex;align-items:center;justify-content:center;font-size:18px
    }
    .dark-btn{background:#2A3247;color:#fff}
    .filter-btn.active{background:var(--yellow);color:var(--ink)}
    .yellow-btn{background:var(--yellow);color:var(--ink)}
    .archive-top-btn{
      gap:7px;
      padding:0 11px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap
    }
    .chatgpt-link{
      text-decoration:none;
      gap:7px;
      padding:0 11px;
      min-height:42px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap
    }
    .chatgpt-link:visited{color:#fff}
    .chatgpt-link:hover{background:#36405A}
    .chatgpt-link-icon{
      font-size:16px;
      line-height:1
    }
    .archive-count{
      min-width:20px;
      height:20px;
      padding:0 6px;
      border-radius:10px;
      background:var(--yellow);
      color:var(--ink);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:900
    }
    .archive-list{display:flex;flex-direction:column;gap:8px}
    .archive-empty{
      border:1px dashed var(--line);
      border-radius:10px;
      padding:28px 14px;
      text-align:center;
      color:var(--muted);
      font-size:13px
    }
    .archive-item{
      display:flex;
      align-items:flex-start;
      gap:11px;
      border:1px solid var(--line);
      border-radius:9px;
      padding:9px;
      background:#FAFAF8
    }
    .archive-item-copy{flex:1;min-width:0}
    .archive-item-name{
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }
    .archive-item-meta{
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      overflow-wrap:anywhere
    }
    .archive-item-price{margin-top:4px;color:var(--green);font-size:11px;font-weight:800}
    .archive-item-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      flex-wrap:wrap;
      flex:0 0 auto;
      max-width:210px
    }
    .archive-item-actions .list-pick{flex:0 0 auto}
    .archive-item-actions .add,
    .archive-item-actions .minus,
    .archive-item-actions .plus{
      min-width:30px;
      height:30px
    }
    .archive-item-actions .add{height:auto;min-height:30px}
    .archive-item-actions strong{min-width:18px;text-align:center;font-size:13px}
    .restore-btn{
      flex:0 0 auto;
      border:0;
      border-radius:7px;
      padding:8px 11px;
      background:var(--green);
      color:#fff;
      font-size:12px;
      font-weight:800
    }
    @media(max-width:560px){
      .archive-item{flex-wrap:wrap}
      .archive-item-copy{min-width:calc(100% - 70px)}
      .archive-item-actions{width:100%;max-width:none;justify-content:flex-end}
    }
    .restore-all-row{
      display:flex;
      justify-content:flex-end;
      margin:0 0 12px
    }
    .restore-all-btn{
      border:1px solid var(--line);
      border-radius:7px;
      padding:8px 12px;
      background:#FAFAF8;
      color:var(--ink);
      font-size:12px;
      font-weight:800
    }
    .content{padding:14px 15px}
    .panel{
      background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;
      margin-bottom:12px
    }
    .panel-title{
      font-size:12px;text-transform:uppercase;letter-spacing:.5px;
      font-weight:800;color:var(--muted);margin-bottom:10px
    }
    .running-low-toggle{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:0;
      margin:0 0 10px;
      border:0;
      background:transparent;
      color:var(--muted);
      text-align:left;
      cursor:pointer
    }
    .running-low-toggle-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-weight:800
    }
    .running-low-toggle-meta{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      font-weight:800
    }
    .running-low-toggle-arrow{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:22px;
      height:22px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#FAFAF8;
      color:var(--ink);
      transition:transform .18s ease
    }
    .running-low-panel.collapsed .running-low-toggle-arrow{
      transform:rotate(-90deg)
    }
    .running-low-panel.collapsed .running-low-content{
      display:none
    }
    .running-low-panel.collapsed .running-low-toggle{
      margin-bottom:0
    }
    .suggestions{display:flex;flex-direction:column;gap:8px}
    .suggestion{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      border:1px solid var(--line);border-radius:8px;padding:9px 10px
    }
    .suggestion strong{font-size:13px}
    .suggestion small{display:block;color:var(--muted);margin-top:2px}
    .suggestion-actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      flex-shrink:0
    }
    .suggestion-add{
      min-width:43px;
      border:0;
      background:var(--yellow);
      border-radius:6px;
      padding:7px 10px;
      color:#111;
      font-weight:800
    }
    @media(max-width:640px){
      .suggestion{align-items:flex-start}
      .suggestion-actions{flex-direction:column;align-items:flex-end}
    }
    .category{margin-bottom:18px}
    .category-head{
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px
    }
    .category-name{
      font-family:Arial Narrow,Arial,sans-serif;
      text-transform:uppercase;font-size:15px;font-weight:800;letter-spacing:.6px
    }
    .category-head button{border:0;background:none;color:var(--ink);opacity:.6;font-size:18px}
    .items{display:flex;flex-direction:column;gap:6px}
    .item{
      background:#fff;border:1px solid var(--line);border-radius:8px;
      padding:10px 10px 10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px
    }
    .item.active{border-color:var(--ink)}
    .item-content{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
    .item-photo-wrap{
      width:48px;height:48px;border-radius:8px;overflow:hidden;flex:0 0 48px;
      border:1px solid var(--line);background:#FAFAF8;display:flex;align-items:center;justify-content:center
    }
    .item-photo{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
    .item-photo-fallback{font-size:20px;color:var(--muted)}
    .item-main{min-width:0;flex:1}
    .item-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-unit{font-size:11px;color:var(--muted);margin-top:3px}
    .item-receipt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:#586174;margin-top:3px;line-height:1.25;white-space:normal}
    .item-receipt + .item-receipt{margin-top:1px}
    .price-badge{font-size:11px;color:var(--muted);margin-top:2px}
    .price-up{color:var(--orange);font-weight:800}
    .price-down{color:var(--green);font-weight:800}
    .qty{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:7px;
      flex-shrink:0;
      flex-wrap:wrap
    }
    .qty button{
      width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
      font-weight:900
    }
    .list-pick{
      display:flex;
      align-items:center;
      gap:3px;
      padding:3px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#F5F4EF
    }
    .list-pick button{
      width:25px;
      height:25px;
      border:0;
      border-radius:5px;
      background:transparent;
      color:var(--muted);
      font-size:11px;
      font-weight:900
    }
    .list-pick button.selected{
      background:var(--ink);
      color:#fff
    }
    .item-list-summary{
      display:flex;
      align-items:center;
      gap:5px;
      flex-wrap:wrap;
      margin-top:5px
    }
    .list-mini-badge{
      display:inline-flex;
      align-items:center;
      min-height:20px;
      padding:2px 7px;
      border-radius:10px;
      background:#EEF0F4;
      color:#3E4659;
      font-size:10px;
      font-weight:800
    }
    @media(max-width:640px){
      .item{align-items:flex-start}
      .qty{max-width:150px}
      .list-pick{order:1}
      .add,.minus,.plus,.qty strong{order:2}
      .remove{order:3}
    }
    .minus{border:1px solid var(--line);background:#FAFAF8}
    .plus{border:0;background:var(--yellow)}
    .add{
      border:0;background:var(--ink);color:#fff;border-radius:6px;
      padding:7px 14px;font-size:12.5px;font-weight:700
    }
    .remove{border:0;background:none;color:#C7C2B4;font-size:18px}
    .custom-row{display:flex;gap:6px;margin-bottom:8px}
    .custom-row input{
      flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:0
    }
    .custom-row button{
      border:0;background:var(--ink);color:#fff;border-radius:6px;padding:0 14px;font-weight:700
    }
    body.checkout-open{overflow:hidden}
    .checkout-modal{
      position:fixed;
      inset:0;
      z-index:95;
      display:none;
      align-items:stretch;
      justify-content:flex-end;
      background:rgba(28,35,51,.56)
    }
    .checkout-modal.open{display:flex}
    .checkout-panel{
      width:min(820px,100%);
      height:100%;
      display:flex;
      flex-direction:column;
      background:#EFEFEF;
      box-shadow:-10px 0 34px rgba(28,35,51,.25)
    }
    .checkout-head{
      min-height:68px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:var(--ink);
      color:#fff
    }
    .checkout-head-copy strong{
      display:block;
      font-family:Arial Narrow,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-size:18px
    }
    .checkout-head-copy span{display:block;margin-top:3px;color:#AEB6C8;font-size:12px}
    .checkout-close{
      width:38px;height:38px;border:0;border-radius:8px;
      background:#2A3247;color:#fff;font-size:25px;line-height:1
    }
    .cart-sheet{
      background:#EFEFEF;
      flex:1;
      overflow:auto;
      padding:16px
    }
    .cart-list-group{
      margin-top:12px;
      border:1px solid #D2D2D2;
      border-radius:10px;
      position:relative;
      z-index:0;
      overflow:visible;
      background:rgba(255,255,255,.35)
    }
    .cart-list-group.menu-open{z-index:50}
    .cart-list-group:first-child{margin-top:8px}
    .cart-list-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:9px 11px;
      background:#E2E2E2;
      border-bottom:1px solid #D0D0D0;
      border-radius:9px 9px 0 0
    }
    .cart-list-name-editor{
      display:flex;
      align-items:center;
      gap:5px;
      flex:1;
      min-width:0
    }
    .cart-list-name-input{
      width:min(230px,100%);
      min-width:0;
      border:1px solid transparent;
      border-radius:6px;
      padding:3px 5px;
      background:transparent;
      color:var(--ink);
      font:900 13px/1.2 Arial,sans-serif;
      outline:0
    }
    .cart-list-name-input:hover{border-color:#C4C4C4;background:rgba(255,255,255,.45)}
    .cart-list-name-input:focus{border-color:#8C96A8;background:#fff}
    .cart-list-name-edit-icon{
      flex:0 0 auto;
      color:#7E8798;
      font-size:12px;
      pointer-events:none
    }
    .cart-list-subtotal{font-size:12px;font-weight:900;color:#3F4656}
    .cart-item{
      padding:8px 10px;
      border-bottom:1px solid #D4D4D4;
      background:transparent
    }
    .cart-item:last-child{border-bottom:0;border-radius:0 0 9px 9px}
    .cart-row{display:grid;grid-template-columns:18px 34px minmax(150px,1fr) auto auto 72px 66px 32px;align-items:center;gap:10px}
    .cart-item-controls{display:flex;align-items:center;gap:5px}
    .cart-item-controls button{
      width:28px;height:28px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900
    }
    .cart-qty-minus{border:1px solid var(--line);background:#FAFAF8}
    .cart-qty-plus{border:0;background:var(--yellow)}
    .cart-qty-value{min-width:18px;text-align:center;font-size:13px;font-weight:900}
    .cart-list-pick{
      display:flex;align-items:center;gap:3px;padding:3px;
      border:1px solid var(--line);border-radius:8px;background:#F5F4EF
    }
    .cart-list-pick button{
      width:25px;height:25px;border:0;border-radius:5px;
      background:transparent;color:var(--muted);font-size:11px;font-weight:900
    }
    .cart-list-pick button.selected{background:var(--ink);color:#fff}
    .cart-remove-item{
      width:30px;height:30px;border:1px solid var(--line);border-radius:7px;
      background:#FAFAF8;color:var(--orange);font-size:16px
    }
    @media(max-width:560px){
      .cart-row{grid-template-columns:18px 34px minmax(0,1fr) auto;gap:8px}
      .cart-list-pick{grid-column:3}
      .cart-item-controls{grid-column:4}
      .price-input{grid-column:3;width:88px}
      .cart-line-total{grid-column:4;min-width:62px}
      .cart-remove-item{grid-column:4;justify-self:end}
    }
    .check{
      width:18px;height:18px;border-radius:4px;border:2px solid #C7C2B4;
      display:flex;align-items:center;justify-content:center;flex-shrink:0
    }
    .check.done{background:var(--green);border-color:var(--green);color:#fff}
    .cart-photo-wrap{
      width:34px;height:34px;border-radius:7px;overflow:hidden;flex:0 0 34px;
      border:1px solid var(--line);background:#FAFAF8;display:flex;align-items:center;justify-content:center
    }
    .cart-photo{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
    .cart-copy{flex:1;min-width:0}
    .cart-name{font-size:14px}
    .cart-receipt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;color:var(--muted);margin-top:2px;line-height:1.2}
    .cart-name.done{text-decoration:line-through;opacity:.5}
    .cart-add-another{position:relative;width:max-content;max-width:100%;margin-top:5px}
    .cart-add-another-btn{
      border:0;
      background:transparent;
      color:#9B4C14;
      padding:0;
      font-size:11px;
      font-weight:900;
      cursor:pointer
    }
    .cart-add-another-btn:hover{text-decoration:underline}
    .cart-add-another-menu{
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      z-index:1000;
      display:none;
      min-width:148px;
      padding:7px;
      border:1px solid var(--line);
      border-radius:9px;
      background:#fff;
      box-shadow:0 8px 22px rgba(28,35,51,.18)
    }
    .cart-add-another.open .cart-add-another-menu{display:block}
    .cart-add-another.open-up .cart-add-another-menu{
      top:auto;
      bottom:calc(100% + 6px)
    }
    .cart-add-another-label{
      padding:2px 4px 6px;
      color:var(--muted);
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.35px
    }
    .cart-add-another-options{display:flex;gap:4px}
    .cart-add-another-options button{
      flex:1;
      min-width:40px;
      height:30px;
      border:1px solid var(--line);
      border-radius:6px;
      background:#F5F4EF;
      color:var(--ink);
      font-size:11px;
      font-weight:900
    }
    .cart-add-another-options button:hover{background:var(--yellow);border-color:var(--yellow)}
    .cart-qty{font-size:13px;font-weight:700;color:var(--muted)}
    .price-input{
      width:72px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px;
      appearance:textfield;
      -moz-appearance:textfield
    }
    .price-input::-webkit-outer-spin-button,
    .price-input::-webkit-inner-spin-button{
      -webkit-appearance:none;
      margin:0
    }
    .cart-line-total{min-width:64px;text-align:right;font-size:13px;font-weight:800}
    .cart-total-row{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      margin-top:12px;padding:12px 2px 4px;border-top:2px solid var(--ink);
      font-size:15px;font-weight:900
    }
    .cart-total-row strong{font-size:21px}
    @media(max-width:560px){
      .price-input{grid-column:3;width:88px}
      .cart-line-total{grid-column:4;min-width:62px}
    }
    .cart-actions{display:flex;gap:8px;margin-top:12px}
    .cart-actions button{
      flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:700
    }
    .checkout-recommendations{
      margin-top:24px;padding-top:18px;border-top:1px solid #D2D2D2
    }
    .checkout-recommendations-head{
      display:flex;align-items:flex-end;justify-content:space-between;
      gap:12px;margin-bottom:12px
    }
    .checkout-recommendations-title{display:block;font-size:17px;font-weight:900}
    .checkout-recommendations-subtitle{margin-top:3px;color:var(--muted);font-size:11px}
    .checkout-recommendations-grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px
    }
    .checkout-recommendation{
      min-width:0;display:grid;grid-template-columns:44px minmax(0,1fr);
      gap:10px;padding:11px;border:1px solid #D2D2D2;border-radius:10px;background:#FAFAF8
    }
    .checkout-recommendation .item-photo-wrap{width:44px;height:44px;flex-basis:44px}
    .checkout-recommendation-copy{min-width:0}
    .checkout-recommendation-name{
      overflow:hidden;font-size:13px;font-weight:900;line-height:1.25;
      text-overflow:ellipsis;white-space:nowrap
    }
    .checkout-recommendation-reason{
      min-height:28px;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.3
    }
    .checkout-recommendation-bottom{

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove("show"),1800);
}
function mainItems(){
  return state.categories.flatMap(c=>c.items.map(i=>{
    i.categoryId=c.id;
    i.categoryName=c.name;
    return i;
  }));
}
function allItems(){
  const byId=new Map(mainItems().map(item=>[item.id,item]));
  (state.sheetArchiveItems||[]).forEach(item=>byId.set(item.id,item));
  return [...byId.values()];
}
function ensureDefaultProductsPresent(){
  DEFAULT_CATEGORIES.forEach(defaultCategory=>{
    let category=state.categories.find(c=>c.id===defaultCategory.id);
    if(!category){
      category={id:defaultCategory.id,name:defaultCategory.name,items:[]};
      state.categories.push(category);
    }
    const existingIds=new Set(category.items.map(item=>item.id));
    defaultCategory.items.forEach(defaultItem=>{
      if(!existingIds.has(defaultItem.id)){
        category.items.push(JSON.parse(JSON.stringify(defaultItem)));
      }
    });
  });
  const wholeMilk=mainItems().find(item=>item.id==="whole-milk");
  if(wholeMilk) wholeMilk.defaultInterval=2;
  saveLocal();
}
function isArchived(itemId){
  return Boolean(state.archived && state.archived[itemId]);
}
function productMatchKey(item){
  const itemNumber=receiptItemNumber(item);
  if(itemNumber) return `#${itemNumber}`;
  return `name:${String(item?.name||"").trim().toLowerCase()}`;
}
function isSheetArchiveProduct(item){
  if(!item) return false;
  if(item.source==="google-sheet-archive") return true;
  const key=productMatchKey(item);
  return (state.sheetArchiveItems||[]).some(archiveItem=>
    archiveItem.id===item.id || productMatchKey(archiveItem)===key
  );
}
function archivedProducts(){
  const products=[];
  const seen=new Set();

  (state.sheetArchiveItems||[]).forEach(item=>{
    const key=productMatchKey(item);
    seen.add(key);
    products.push({...item,archiveKind:"sheet"});
  });

  mainItems()
    .filter(item=>isArchived(item.id))
    .forEach(item=>{
      const key=productMatchKey(item);
      if(seen.has(key)) return;
      seen.add(key);
      products.push({...item,archiveKind:"manual"});
    });

  return products.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
}
function archiveProduct(itemId){
  const item=mainItems().find(product=>product.id===itemId);
  if(!item) return;
  state.archived[itemId]={
    archivedAt:new Date().toISOString(),
    name:item.name||"",
    itemNumber:item.itemNumber||receiptItemNumber(item)||""
  };
  delete state.cart[itemId];
  delete state.cart2[itemId];
  delete state.cart3[itemId];
  delete state.itemListSelection[itemId];
  delete state.checked[itemId];
  delete state.checked[`1|${itemId}`];
  delete state.checked[`2|${itemId}`];
  delete state.checked[`3|${itemId}`];
  delete state.cartPrices[itemId];
  if(activeDetailItemId===itemId) closeItemDetail();
  saveLocal();
  render();
  toast(`${item.name} moved to Archive`);
}
function restoreProduct(itemId){
  const item=allItems().find(product=>product.id===itemId);
  delete state.archived[itemId];
  saveLocal();
  render();
  toast(`${item?.name||"Product"} restored`);
}
function restoreAllProducts(){
  const count=Object.keys(state.archived||{}).length;
  state.archived={};
  saveLocal();
  render();
  toast(count?`${count} products restored`:"Archive is already empty");
}
function renderArchive(){
  const items=archivedProducts();
  const manuallyHidden=mainItems().filter(item=>isArchived(item.id));
  const countEl=document.getElementById("archiveCount");
  if(countEl) countEl.textContent=String(items.length);

  const root=document.getElementById("archiveItems");
  const restoreAll=document.getElementById("restoreAllBtn");
  if(!root) return;
  if(restoreAll){
    restoreAll.disabled=!manuallyHidden.length;
    restoreAll.parentElement.classList.toggle("hidden",!manuallyHidden.length);
  }

  if(!items.length){
    root.innerHTML=`<div class="archive-empty">No products in Archive.</div>`;
    return;
  }

  root.innerHTML=items.map(item=>{
    const activeList=selectedList(item.id);
    const activeListQty=qty(item.id,activeList);
    const price=itemUnitPrice(item);
    return `
      <div class="archive-item">
        ${imageHtml(item,true)}

          </div>
          ${item.weight?`<div class="archive-item-meta">${escapeHtml(item.weight)}</div>`:""}
          ${price>0?`<div class="archive-item-price">$${price.toFixed(2)}</div>`:""}
          ${listSummaryHtml(item.id)}

          <div class="list-pick" aria-label="Choose shopping list">

            `).join("")}
          </div>

            <strong>${activeListQty}</strong>
            <button class="plus" data-plus="${item.id}" aria-label="Increase quantity in List ${activeList}">+</button>
          `:`
            <button class="add" data-plus="${item.id}">Add</button>
          `}
          ${item.archiveKind==="manual"
            ?`<button type="button" class="restore-btn" data-restore="${item.id}">Restore</button>`
            :""

function applyDefaultPricing(){
  const items=allItems();
  items.forEach(item=>{
    const estimate=DEFAULT_ONLINE_PRICE_ESTIMATES[item.id];
    if(estimate){
      if(!item.itemNumber) item.itemNumber=estimate.itemNumber||"";
      if(!(Number(item.estimatedPrice)>0)) item.estimatedPrice=estimate.price;
      if(!item.priceSource) item.priceSource=estimate.source;
      if(!item.priceDate) item.priceDate=estimate.date;
    }
    const defaults=DEFAULT_PRICE_HISTORY[item.id]||[];
    if(defaults.length){
      const existing=state.priceHistory[item.id]||[];
      const byKey=new Map(existing.map(row=>[`${row.date}|${Number(row.price).toFixed(2)}`,row]));
      defaults.forEach(row=>byKey.set(`${row.date}|${Number(row.price).toFixed(2)}`,row));
      state.priceHistory[item.id]=[...byKey.values()].sort((a,b)=>b.date.localeCompare(a.date));
    }
  });
  saveLocal();
}
function itemUnitPrice(item){
  const sheetPrice=Number(item?.sheetPrice);
  if(Number.isFinite(sheetPrice)&&sheetPrice>0) return sheetPrice;
  const latest=sortedHistory(item?.id)[0]?.price;
  if(Number.isFinite(Number(latest))&&Number(latest)>0) return Number(latest);
  const estimate=Number(item?.estimatedPrice);
  return Number.isFinite(estimate)&&estimate>0?estimate:0;
}
function receiptEntries(item){
  if(Array.isArray(item.receipt)) return item.receipt.filter(Boolean);
  return item.receipt ? [item.receipt] : [];
}
function primaryReceipt(item){
  return receiptEntries(item)[0] || "";
}
function receiptSearchText(item){
  return receiptEntries(item).join(" ").toLowerCase();
}
function receiptLinesHtml(item, className="item-receipt"){
  return receiptEntries(item).map(line=>`<div class="${className}">${escapeHtml(line)}</div>`).join("");
}
function itemNumbersHtml(item, className="item-receipt"){
  const numbers=[...new Set(
    receiptEntries(item)
      .map(line=>{
        const match=String(line).match(/^\s*(\d+)/);
        return match ? match[1] : "";
      })
      .filter(Boolean)
  )];

  if(!numbers.length && item.itemNumber){
    numbers.push(String(item.itemNumber));
  }

  return numbers.length
    ? `<div class="${className}">${numbers.map(escapeHtml).join(" / ")}</div>`
    : "";
}
const LIST_NUMBERS=[1,2,3];

function defaultListName(listNo){
  return `List ${Number(listNo)}`;
}
function listName(listNo){
  const customName=String(state.listNames?.[listNo]??"").trim();
  return customName||defaultListName(listNo);
}
function cartFor(listNo){
  const list=Number(listNo);
  if(list===2) return state.cart2;
  if(list===3) return state.cart3;
  return state.cart;
}
function selectedList(id){
  const list=Number(state.itemListSelection[id]||1);
  return LIST_NUMBERS.includes(list)?list:1;
}
function setSelectedList(id,listNo){
  const list=Number(listNo);
  if(!LIST_NUMBERS.includes(list)) return;
  state.itemListSelection[id]=list;

  renderCategories();
  renderArchive();

}
function qty(id,listNo=selectedList(id)){
  return Number(cartFor(listNo)[id]||0);
}
function totalQty(id){
  return LIST_NUMBERS.reduce((sum,listNo)=>sum+qty(id,listNo),0);
}
function checkedKey(listNo,id){
  return `${Number(listNo)}|${id}`;
}
function isChecked(listNo,id){
  return Boolean(state.checked[checkedKey(listNo,id)] || (Number(listNo)===1 && state.checked[id]));
}
function listSummaryHtml(itemId){
  const badges=LIST_NUMBERS
    .map(listNo=>({listNo,quantity:qty(itemId,listNo)}))

function listSummaryText(itemId){

    .map(listNo=>({listNo,quantity:qty(itemId,listNo)}))
    .filter(row=>row.quantity>0)
    .map(row=>`List ${row.listNo}: ${row.quantity}`);
  return parts.join(" · ");
}
function setQty(id,value,listNo=selectedList(id)){
  const list=Number(listNo);
  const cart=cartFor(list);
  const next=Math.max(0,Number(value)||0);

  if(next<=0) delete cart[id];
  else cart[id]=next;

  if(totalQty(id)<=0){
    delete state.cartPrices[id];
    delete state.checked[id];
    LIST_NUMBERS.forEach(number=>delete state.checked[checkedKey(number,id)]);
  }

  saveLocal();
  render();
  queueSync("setCart",{itemId:id,quantity:next,listNumber:list});
}
function sortedHistory(id){
  return [...(state.priceHistory[id]||[])].sort((a,b)=>b.date.localeCompare(a.date));
}
function priceBadge(id){
  const item=allItems().find(x=>x.id===id);
  const sheetPrice=Number(item?.sheetPrice);
  const h=sortedHistory(id);
  if(Number.isFinite(sheetPrice) && sheetPrice>0){
    const previous=h[0]?.price;
    let delta="";
    if(previous){
      const d=+(sheetPrice-previous).toFixed(2);
      if(Math.abs(d)>=.01) delta=` <span class="${d>0?"price-up":"price-down"}">${d>0?"↑":"↓"}$${Math.abs(d).toFixed(2)}</span>`;
    }
    return `<div class="price-badge">sheet price $${sheetPrice.toFixed(2)}${delta}</div>`;
  }
  if(h.length){
    const latest=h[0],prev=h[1];
    let delta="";
    if(prev){
      const d=+(latest.price-prev.price).toFixed(2);
      if(Math.abs(d)>=.01) delta=` <span class="${d>0?"price-up":"price-down"}">${d>0?"↑":"↓"}$${Math.abs(d).toFixed(2)}</span>`;
    }
    return `<div class="price-badge">last paid $${Number(latest.price).toFixed(2)}${delta}</div>`;
  }
  const estimate=Number(item?.estimatedPrice);
  if(Number.isFinite(estimate)&&estimate>0){
    return `<div class="price-badge">online estimate $${estimate.toFixed(2)}</div>`;
  }
  return "";
}

function getLastPurchaseDate(itemId){
  for(const order of [...state.orders].reverse()){
    if(order.items.some(x=>x.id===itemId)) return order.date;
  }
  const h=sortedHistory(itemId);
  return h[0]?.date||null;
}
function dayDiff(dateStr){
  const then=new Date(dateStr+"T00:00:00");
  return Math.floor((Date.now()-then.getTime())/86400000);
}
function getSuggestions(){
  return allItems()
    .filter(item=>!isArchived(item.id) && !isSheetArchiveProduct(item))
    .map(item=>{
      const last=getLastPurchaseDate(item.id);
      if(!last) return null;
      const elapsed=dayDiff(last);
      const interval=item.defaultInterval||14;
      const score=elapsed/interval;
      return {...item,elapsed,interval,score};
    })
    .filter(Boolean)
    .filter(x=>x.score>=.8 && !totalQty(x.id))
    .sort((a,b)=>b.score-a.score)
    .slice(0,6);
}

function getCheckoutRecommendations(){
  return allItems()
    .filter(item=>!isArchived(item.id) && !isSheetArchiveProduct(item) && !totalQty(item.id))
    .map(item=>{
      const last=getLastPurchaseDate(item.id);
      if(!last) return null;
      const elapsed=dayDiff(last);
      const interval=Number(item.defaultInterval)||14;
      return {...item,elapsed,interval,score:elapsed/interval};
    })
    .filter(Boolean)
    .filter(item=>item.score>=.65)
    .sort((a,b)=>b.score-a.score || a.interval-b.interval)
    .slice(0,6);
}

function normalizeImageUrl(value){
  let url=String(value||"").trim();
  if(!url) return "";
  const imageFormula=url.match(/^=IMAGE\(\s*["']([^"']+)["']/i);
  if(imageFormula) url=imageFormula[1];
  const hyperlinkFormula=url.match(/^=HYPERLINK\(\s*["']([^"']+)["']/i);
  if(hyperlinkFormula) url=hyperlinkFormula[1];
  url=url.replace(/&amp;/gi,"&").trim();

  try{
    const parsed=new URL(url);
    if(parsed.protocol!=="https:" && parsed.protocol!=="http:") return "";

    /* The sheet stores Dropbox share links. Convert them at runtime to
       direct image links; no product-specific image URLs live in this HTML. */
    if(/(^|\.)dropbox\.com$/i.test(parsed.hostname)){
      parsed.hostname="dl.dropboxusercontent.com";
      parsed.searchParams.delete("dl");
      parsed.searchParams.delete("raw");
      return parsed.href;
    }

    /* Also accept ordinary Google Drive share links placed in the same cell. */
    if(parsed.hostname==="drive.google.com"){
      const fileMatch=parsed.pathname.match(/\/file\/d\/([^/]+)/i);
      const fileId=fileMatch?.[1]||parsed.searchParams.get("id");
      if(fileId){
        return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(fileId)}`;
      }
    }

    return parsed.href;
  }catch{
    return "";
  }
}

function normalizeProductLink(value){
  let link=String(value??"").trim();
  if(!link) return "";

  const hyperlinkFormula=link.match(/^=HYPERLINK\(\s*["']([^"']+)["']/i);
  if(hyperlinkFormula) link=hyperlinkFormula[1];

  try{
    const url=new URL(link);
    if(url.protocol!=="https:" && url.protocol!=="http:") return "";
    return url.href;
  }catch{
    return "";
  }
}
function itemImageData(item){
  const configured=item.imageUrl || "";
  if(!configured) return {src:"",fallback:""};
  if(typeof configured==="string") return {src:normalizeImageUrl(configured),fallback:""};
  return {src:normalizeImageUrl(configured.src||""),fallback:normalizeImageUrl(configured.fallback||"")};
}
function imageHtml(item,cart=false){
  const image=itemImageData(item);
  const wrapClass=cart?"cart-photo-wrap":"item-photo-wrap";
  const imgClass=cart?"cart-photo":"item-photo";
  if(!image.src) return `<div class="${wrapClass}"><span class="item-photo-fallback">🛒</span></div>`;
  return `<div class="${wrapClass}">
    <img class="${imgClass}"
      src="${escapeHtml(image.src)}"
      data-fallback="${escapeHtml(image.fallback)}"
      alt="${escapeHtml(item.name)}"
      loading="lazy"
      referrerpolicy="no-referrer"
      onerror="
        if(this.dataset.fallback && !this.dataset.fallbackUsed){
          this.dataset.fallbackUsed='1';
          this.src=this.dataset.fallback;
        }else{
          this.style.display='none';
          this.nextElementSibling.style.display='inline';
        }

    <span class="item-photo-fallback" style="display:none">🛒</span>
  </div>`;
}

function updateCartTotal(){
  let grandTotal=0;

  LIST_NUMBERS.forEach(listNo=>{
    let subtotal=0;

    allItems().filter(item=>qty(item.id,listNo)>0).forEach(item=>{
      const stored=state.cartPrices[item.id];
      const price=stored!==undefined&&stored!==""?(parseFloat(stored)||0):itemUnitPrice(item);
      const line=price*qty(item.id,listNo);
      subtotal+=line;

      const key=`${listNo}|${item.id}`;
      const lineEl=[...document.querySelectorAll("[data-line-total]")]
        .find(element=>element.dataset.lineTotal===key);
      if(lineEl) lineEl.textContent=`$${line.toFixed(2)}`;
    });

    const subtotalEl=document.getElementById(`listSubtotal${listNo}`);
    if(subtotalEl) subtotalEl.textContent=`$${subtotal.toFixed(2)}`;
    grandTotal+=subtotal;
  });

  const totalEl=document.getElementById("cartTotal");
  if(totalEl) totalEl.textContent=`$${grandTotal.toFixed(2)}`;
  const headerTotalEl=document.getElementById("headerCartTotal");
  if(headerTotalEl) headerTotalEl.textContent=`$${grandTotal.toFixed(2)}`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function api(action,payload={}){
  const url=state.settings.sheetApiUrl;
  if(!url) throw new Error("Google Sheet API URL is not configured");
  const res=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,...payload})
  });
  if(!res.ok) throw new Error("API error");
  return res.json();
}
function queueSync(action,payload){
  if(!state.settings.sheetApiUrl) return;
  api(action,payload).catch(()=>{});
}
function setSheetStatus(message,isError=false){
  const el=document.getElementById("sheetStatus");
  if(!el) return;
  el.textContent=message;
  el.style.color=isError?"var(--orange)":"var(--muted)";

function spreadsheetIdFromUrl(value){
  const text=String(value||"").trim();
  const match=text.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return match?match[1]:text;
}
function parseCost(value){
  if(typeof value==="number") return value;
  const n=parseFloat(String(value||"").replace(/[$,]/g,""));
  return Number.isFinite(n)?n:null;
}
function parseCsv(text){
  const rows=[];
  let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"' && quoted && next==='"'){cell+='"';i++;continue}
    if(ch==='"'){quoted=!quoted;continue}
    if(ch===',' && !quoted){row.push(cell);cell="";continue}
    if((ch==='\n'||ch==='\r') && !quoted){
      if(ch==='\r'&&next==='\n') i++;
      row.push(cell);cell="";
      if(row.some(v=>String(v).trim()!=="")) rows.push(row);
      row=[];continue;
    }
    cell+=ch;
  }
  row.push(cell);
  if(row.some(v=>String(v).trim()!=="")) rows.push(row);
  if(!rows.length) return [];
  const headers=rows[0].map(x=>String(x).trim());
  return rows.slice(1).map(r=>({
    ...Object.fromEntries(headers.map((h,i)=>[h,r[i]??""])),
    __cells:r
  }));
}
function parseGviz(text){
  const first=text.indexOf("{");
  const last=text.lastIndexOf("}");
  if(first<0||last<first) throw new Error("Invalid Google Sheet response");
  const data=JSON.parse(text.slice(first,last+1));
  const table=data.table||{};
  const headers=(table.cols||[]).map((c,i)=>String(c.label||c.id||`Column ${i+1}`).trim());
  return (table.rows||[]).map(row=>{
    const obj={};
    const cells=[];
    headers.forEach((header,i)=>{
      const cell=row.c?.[i];
      const value=cell?.v??cell?.f??"";
      obj[header]=value;
      cells.push(value);
    });
    obj.__cells=cells;
    return obj;
  });
}
async function fetchPublicSheetRows(tabOverride="",gidOverride=""){
  const id=spreadsheetIdFromUrl(state.settings.spreadsheetUrl||CONFIG.GOOGLE_SHEET_URL);
  const tab=tabOverride||state.settings.spreadsheetTab||CONFIG.GOOGLE_SHEET_TAB||"Items";
  const gid=gidOverride||state.settings.spreadsheetGid||CONFIG.GOOGLE_SHEET_GID||"0";
  if(!id) throw new Error("Spreadsheet ID is missing");

  const gviz=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}&headers=1&_=${Date.now()}`;
  try{
    const res=await fetch(gviz,{cache:"no-store",credentials:"omit"});
    if(!res.ok) throw new Error("Google Visualization request failed");
    const rows=parseGviz(await res.text());
    if(rows.length) return rows;
  }catch(error){console.warn("GViz load failed",error)}

  const csv=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/export?format=csv&gid=${encodeURIComponent(gid)}&_=${Date.now()}`;
  const res=await fetch(csv,{cache:"no-store",credentials:"omit"});
  if(!res.ok) throw new Error("Google Sheet CSV request failed");
  return parseCsv(await res.text());
}
function sheetValue(row,names){
  const keys=Object.keys(row||{});
  let firstMatchedValue="";

  for(const name of names){
    const key=keys.find(k=>String(k).trim().toLowerCase()===String(name).trim().toLowerCase());
    if(key===undefined) continue;

    const value=row[key];
    if(firstMatchedValue==="") firstMatchedValue=value;

    if(value!==null && value!==undefined && String(value).trim()!==""){
      return value;
    }
  }

  return firstMatchedValue||"";
}
function receiptItemNumber(item){
  const direct=String(item.itemNumber||"").trim();
  if(direct) return direct;
  const match=primaryReceipt(item).match(/^\s*(\d+)/);
  return match?match[1]:"";
}
function slugify(value){
  return String(value||"item").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||`item-${Date.now()}`;
}
function cleanProductRows(rows,{archiveLayout=false}={}){
  return (rows||[]).map(row=>{
    const cells=Array.isArray(row?.__cells)?row.__cells:[];
    const namedCategory=sheetValue(row,["Category"]);
    const namedCost=sheetValue(row,["Cost","Price"]);
    const category=archiveLayout && cells.length>=11 ? (cells[9]||namedCategory) : namedCategory;
    const costValue=archiveLayout && cells.length>=11 ? (cells[10]??namedCost) : namedCost;
    return {
    name:String(sheetValue(row,["Item","Name","Product"] )||"").trim(),
    itemNumber:String(sheetValue(row,["#","Item #","Item Number","SKU"] )||"").replace(/\.0$/,"" ).trim(),
    cost:parseCost(costValue),
    pic:normalizeImageUrl(sheetValue(row,["Pic Dropbox","Dropbox Pic","Pic URL","Pic","Picture","Image","Image URL","Photo"])),
    weight:String(sheetValue(row,["Weight","Size","Unit"] )||"").trim(),
    link:normalizeProductLink(sheetValue(row,["Link","Product Link","Costco Link","Official Link","Website","URL"])),
    description:String(sheetValue(row,["Description","Details"] )||"").trim(),
    category:String(category||"").trim()
    };
  }).filter(r=>r.name||r.itemNumber);
}
function mergeProductsFromRows(rows){
  const cleanRows=cleanProductRows(rows);

  state.categories.forEach(cat=>{cat.items=cat.items.filter(item=>item.source!=="google-sheet")});
  const existing=mainItems();
  let updated=0,added=0;

  cleanRows.forEach(row=>{
    const itemNumber=row.itemNumber;
    let item=existing.find(x=>itemNumber && receiptItemNumber(x)===itemNumber);
    if(!item) item=existing.find(x=>x.name.toLowerCase()===row.name.toLowerCase());
    if(item){
      if(row.name) item.name=row.name;
      if(itemNumber){
        item.itemNumber=itemNumber;
        if(!receiptEntries(item).length) item.receipt=[`${itemNumber} - ${row.name.toUpperCase()}`];
      }
      if(row.cost!==null){item.sheetPrice=row.cost;item.priceSource="sheet";}
      if(row.pic){
        item.imageUrl=row.pic;
        item.imageSource="Google Sheet: Pic Dropbox";
      }
      if(row.weight){item.weight=row.weight;item.unit=row.weight}
      if(row.link) item.productLink=row.link;
      if(row.description) item.description=row.description;
      updated++;
      return;
    }

    const categoryName=row.category||"Google Sheet Products";
    let cat=state.categories.find(c=>c.name.toLowerCase()===categoryName.toLowerCase());
    if(!cat){
      cat={id:`sheet-category-${slugify(categoryName)}`,name:categoryName,items:[]};
      state.categories.push(cat);
    }
    const id=`sheet-${itemNumber||slugify(row.name)}`;
    const created={
      id,
      name:row.name||`Costco Item ${itemNumber}`,
      itemNumber,
      receipt:itemNumber?[`${itemNumber} - ${(row.name||"ITEM").toUpperCase()}`]:[],
      unit:row.weight||"pc",
      weight:row.weight,
      productLink:row.link,
      description:row.description,
      sheetPrice:row.cost,
      priceSource:row.cost!==null?"sheet":"",
      imageUrl:row.pic,
      imageSource:row.pic?"Google Sheet: Pic Dropbox":"",
      defaultInterval:14,
      source:"google-sheet"
    };
    cat.items.push(created);
    existing.push(created);
    added++;
  });
  saveLocal();
  return {rows:cleanRows.length,updated,added};
}
function replaceArchiveProductsFromRows(rows){
  const cleanRows=cleanProductRows(rows,{archiveLayout:true});
  const existingMain=mainItems();

  state.sheetArchiveItems=cleanRows.map(row=>{
    const itemNumber=row.itemNumber;
    let existing=existingMain.find(item=>itemNumber && receiptItemNumber(item)===itemNumber);
    if(!existing && row.name){
      existing=existingMain.find(item=>String(item.name||"").toLowerCase()===row.name.toLowerCase());
    }

    const id=existing?.id||`sheet-archive-${itemNumber||slugify(row.name)}`;
    const categoryName=row.category||existing?.categoryName||"Archive";
    return {
      ...(existing||{}),
      id,
      name:row.name||existing?.name||`Costco Item ${itemNumber}`,
      itemNumber:itemNumber||existing?.itemNumber||"",
      receipt:itemNumber?[`${itemNumber} - ${(row.name||existing?.name||"ITEM").toUpperCase()}`]:(existing?.receipt||[]),
      unit:row.weight||existing?.unit||"pc",
      weight:row.weight||existing?.weight||"",
      productLink:row.link||existing?.productLink||"",
      description:row.description||existing?.description||"",
      sheetPrice:row.cost!==null?row.cost:existing?.sheetPrice,
      priceSource:row.cost!==null?"sheet":(existing?.priceSource||""),
      imageUrl:row.pic||existing?.imageUrl||"",
      imageSource:row.pic?"Google Sheet: Archive":(existing?.imageSource||""),
      defaultInterval:existing?.defaultInterval||14,
      categoryId:"sheet-archive",
      categoryName,
      source:"google-sheet-archive"
    };
  });

  saveLocal();
  return {rows:state.sheetArchiveItems.length};
}
async function loadFromSheet(){
  setSheetStatus("Loading products from Google Sheet...");
  const archiveTab=state.settings.spreadsheetArchiveTab||CONFIG.GOOGLE_SHEET_ARCHIVE_TAB||"Archive";
  const archiveGid=state.settings.spreadsheetArchiveGid||CONFIG.GOOGLE_SHEET_ARCHIVE_GID||"899246934";
  const archiveRequest=fetchPublicSheetRows(archiveTab,archiveGid)
    .then(rows=>({rows,error:null}))
    .catch(error=>({rows:null,error}));

  try{
    let rows=[];
    try{
      rows=await fetchPublicSheetRows();
    }catch(publicError){
      if(!state.settings.sheetApiUrl) throw publicError;
      const data=await api("getProducts");
      rows=data.rows||data.products||data;
    }
    const result=mergeProductsFromRows(rows);
    const archiveLoad=await archiveRequest;
    let archiveResult={rows:(state.sheetArchiveItems||[]).length};
    if(archiveLoad.rows){
      archiveResult=replaceArchiveProductsFromRows(archiveLoad.rows);
    }else{
      console.warn("Archive sheet load failed; using saved Archive products",archiveLoad.error);
    }
    render();
    setSheetStatus(`${result.rows} product row${result.rows===1?"":"s"} loaded · ${archiveResult.rows} archive row${archiveResult.rows===1?"":"s"} loaded`);
    toast(archiveLoad.rows?"Products and Archive refreshed":"Products refreshed · using saved Archive");
  }catch(error){
    console.error(error);
    setSheetStatus("Could not read the Google Sheet. Confirm the tab is named Items and set Share → General access → Anyone with the link → Viewer.",true);
    toast("Using saved product data");
  }
}

function saveOrder(){
  const items=[];

  LIST_NUMBERS.forEach(listNo=>{
    allItems().filter(item=>qty(item.id,listNo)>0).forEach(item=>{
      const stored=state.cartPrices[item.id];
      const price=stored!==undefined&&stored!==""?(parseFloat(stored)||0):itemUnitPrice(item);

      items.push({
        id:item.id,
        name:item.name,
        itemNumber:receiptItemNumber(item),
        receipt:receiptEntries(item),
        qty:qty(item.id,listNo),
        list:listNo,
        unit:item.unit,
        weight:item.weight||"",
        description:item.description||"",
        imageUrl:itemImageData(item).src||"",
        price:price||null
      });
    });
  });

  if(!items.length) return;

  const date=new Date().toISOString().slice(0,10);
  const pricesSaved=new Set();

  items.forEach(item=>{
    if(!item.price || pricesSaved.has(item.id)) return;
    pricesSaved.add(item.id);

    state.priceHistory[item.id]=state.priceHistory[item.id]||[];
    const old=state.priceHistory[item.id].find(row=>row.date===date);
    if(old) old.price=item.price;
    else state.priceHistory[item.id].push({date,price:item.price});
  });

  const order={id:"order-"+Date.now(),date,items};
  state.orders.push(order);
  saveLocal();
  queueSync("saveOrder",order);
  toast("Order and all three lists saved");
  render();
}
function copyList(){
  const sections=[];
  let grandTotal=0;

  LIST_NUMBERS.forEach(listNo=>{
    const items=allItems().filter(item=>qty(item.id,listNo)>0);
    if(!items.length) return;
    const currentListName=listName(listNo);

    let subtotal=0;
    const lines=items.map(item=>{
      const stored=state.cartPrices[item.id];
      const price=stored!==undefined&&stored!==""?(parseFloat(stored)||0):itemUnitPrice(item);
      const lineTotal=price*qty(item.id,listNo);
      subtotal+=lineTotal;

      return `${item.name}${primaryReceipt(item)?` | ${primaryReceipt(item)}`:""} — ${qty(item.id,listNo)} ${item.weight||item.unit} × $${price.toFixed(2)} = $${lineTotal.toFixed(2)}`;
    });

    grandTotal+=subtotal;
    sections.push([currentListName,...lines,`${currentListName} subtotal: $${subtotal.toFixed(2)}`].join("\n"));
  });

  const text=[...sections,`ESTIMATED TOTAL: $${grandTotal.toFixed(2)}`].join("\n\n");
  navigator.clipboard?.writeText(text)
    .then(()=>toast("All lists copied"))
    .catch(()=>toast("Unable to copy"));
}

document.addEventListener("click",e=>{

    renderCategories();

    document.getElementById("categoryFilterBtn").setAttribute("aria-expanded","false");

  }
  const cartAddMenuButton=t.closest("[data-cart-add-menu]");
  if(cartAddMenuButton){
    const wrap=cartAddMenuButton.closest(".cart-add-another");
    const willOpen=!wrap.classList.contains("open");
    document.querySelectorAll(".cart-add-another.open").forEach(element=>{
      element.classList.remove("open");
      element.classList.remove("open-up");
      element.closest(".cart-list-group")?.classList.remove("menu-open");
      element.querySelector("[data-cart-add-menu]")?.setAttribute("aria-expanded","false");
    });
    if(willOpen){
      const sheetRect=cartAddMenuButton.closest(".cart-sheet")?.getBoundingClientRect();
      const buttonRect=cartAddMenuButton.getBoundingClientRect();
      wrap.classList.toggle("open-up",Boolean(sheetRect && sheetRect.bottom-buttonRect.bottom<110));
      wrap.classList.add("open");
      wrap.closest(".cart-list-group")?.classList.add("menu-open");
      cartAddMenuButton.setAttribute("aria-expanded","true");
    }
    return;
  }
  const cartAddToButton=t.closest("[data-cart-add-to]");
  if(cartAddToButton){
    const parts=cartAddToButton.dataset.cartAddTo.split("|");
    parts.shift();
    const targetList=Number(parts.pop());
    const itemId=parts.join("|");
    const item=allItems().find(product=>product.id===itemId);
    if(item && LIST_NUMBERS.includes(targetList)){
      state.itemListSelection[itemId]=targetList;
      setQty(itemId,qty(itemId,targetList)+1,targetList);

      element.querySelector("[data-cart-add-menu]")?.setAttribute("aria-expanded","false");
    });
  }
  if(t.dataset.plus) setQty(t.dataset.plus,qty(t.dataset.plus)+1);
  if(t.dataset.minus) setQty(t.dataset.minus,qty(t.dataset.minus)-1);
  if(t.dataset.check){
    const [listText,...idParts]=t.dataset.check.split("|");
    const listNo=Number(listText);
    const itemId=idParts.join("|");
    const key=checkedKey(listNo,itemId);
    state.checked[key]=!isChecked(listNo,itemId);
    if(listNo===1) delete state.checked[itemId];
    saveLocal();
    renderCart();
  }

    setQty(itemId,qty(itemId,1)+1,1);
  }
  if(t.dataset.checkoutRecommendation){

    setQty(itemId,qty(itemId,1)+1,1);

    const itemId=idParts.join("|");

    const listNo=Number(listText);
    const itemId=idParts.join("|");
    setQty(itemId,qty(itemId,listNo)-1,listNo);
  }
  if(t.dataset.cartRemove){
    const [listText,...idParts]=t.dataset.cartRemove.split("|");
    const listNo=Number(listText);
    const itemId=idParts.join("|");
    setQty(itemId,0,listNo);
  }
  if(t.dataset.cartMove){
    const parts=t.dataset.cartMove.split("|");
    const sourceList=Number(parts.shift());
    const targetList=Number(parts.pop());
    const itemId=parts.join("|");
    if(sourceList!==targetList && LIST_NUMBERS.includes(targetList)){
      const movingQty=qty(itemId,sourceList);
      const combinedQty=qty(itemId,targetList)+movingQty;
      delete cartFor(sourceList)[itemId];
      cartFor(targetList)[itemId]=combinedQty;
      state.itemListSelection[itemId]=targetList;
      delete state.checked[checkedKey(sourceList,itemId)];
      saveLocal();
      render();
      queueSync("setCart",{itemId,quantity:0,listNumber:sourceList});
      queueSync("setCart",{itemId,quantity:combinedQty,listNumber:targetList});
    }
  }
  if(t.dataset.listSelect){
    const [itemId,listNo]=t.dataset.listSelect.split("|");
    setSelectedList(itemId,Number(listNo));
  }
  if(t.dataset.detail) showItemDetail(t.dataset.detail);
  if(t.dataset.drawerPlus) setQty(t.dataset.drawerPlus,qty(t.dataset.drawerPlus)+1);
  if(t.dataset.drawerMinus) setQty(t.dataset.drawerMinus,qty(t.dataset.drawerMinus)-1);
  if(t.dataset.closeDrawer) closeItemDetail();

  if(t.dataset.addCustom){
    document.getElementById("custom-"+t.dataset.addCustom).classList.toggle("hidden");
  }
  if(t.dataset.customSave){
    const catId=t.dataset.customSave;
    const input=document.querySelector(`[data-custom-input="${catId}"]`);
    const name=input.value.trim();
    if(!name) return;
    const cat=state.categories.find(c=>c.id===catId);
    const id="custom-"+Date.now();
    cat.items.push({id,name,unit:"pc",defaultInterval:14});
    setQty(id,1);
    input.value="";
  }
  if(t.dataset.archive) archiveProduct(t.dataset.archive);
  if(t.dataset.restore) restoreProduct(t.dataset.restore);
  if(t.dataset.close){
    document.getElementById(t.dataset.close).classList.remove("open");
    if(t.dataset.close==="categoryFilterModal"){
      document.getElementById("categoryFilterBtn").setAttribute("aria-expanded","false");
    }
  }
});

document.getElementById("cartItems").addEventListener("input",e=>{
  if(e.target.dataset.listName){
    const listNo=Number(e.target.dataset.listName);
    if(LIST_NUMBERS.includes(listNo)){
      state.listNames[listNo]=e.target.value;
      saveLocal();
    }
    return;
  }
  if(e.target.dataset.price){
    const itemId=e.target.dataset.price;
    state.cartPrices[itemId]=e.target.value;
    document.querySelectorAll("[data-price]").forEach(input=>{
      if(input!==e.target && input.dataset.price===itemId) input.value=e.target.value;
    });
    saveLocal();
    updateCartTotal();
  }
});
document.getElementById("cartItems").addEventListener("focusout",e=>{
  if(!e.target.dataset.listName) return;
  const listNo=Number(e.target.dataset.listName);
  if(!LIST_NUMBERS.includes(listNo)) return;
  const normalized=String(e.target.value||"").trim()||defaultListName(listNo);
  state.listNames[listNo]=normalized;
  e.target.value=normalized;
  saveLocal();
});
document.getElementById("cartItems").addEventListener("keydown",e=>{
  if(e.target.dataset.listName && e.key==="Enter"){
    e.preventDefault();
    e.target.blur();
  }
});
document.getElementById("searchInput").addEventListener("input",e=>{state.query=e.target.value;renderCategories()});
document.getElementById("refreshSheetBtn").onclick=loadFromSheet;
document.getElementById("categoryFilterBtn").onclick=()=>{
  renderCategoryFilter();
  document.getElementById("categoryFilterModal").classList.add("open");
  document.getElementById("categoryFilterBtn").setAttribute("aria-expanded","true");
};
document.getElementById("categoryFilterModal").addEventListener("click",e=>{
  if(e.target.id==="categoryFilterModal"){
    e.currentTarget.classList.remove("open");
    document.getElementById("categoryFilterBtn").setAttribute("aria-expanded","false");
  }
});
document.getElementById("archiveBtn").onclick=()=>{
  renderArchive();
  document.getElementById("archiveModal").classList.add("open");
};
document.getElementById("restoreAllBtn").onclick=restoreAllProducts;
document.getElementById("cartButton").onclick=openCheckout;
document.getElementById("checkoutClose").onclick=closeCheckout;
document.getElementById("checkoutModal").addEventListener("click",e=>{
  if(e.target.id==="checkoutModal") closeCheckout();
});
document.getElementById("copyBtn").onclick=copyList;
document.getElementById("saveOrderBtn").onclick=saveOrder;
document.getElementById("clearBtn").onclick=clearCart;
document.getElementById("runningLowToggle").onclick=()=>{
  state.runningLowCollapsed=!state.runningLowCollapsed;
  saveLocal();
  renderSuggestions();
};

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && activeDetailItemId) closeItemDetail();
  else if(e.key==="Escape" && state.cartOpen) closeCheckout();
  else if(e.key==="Escape" && document.getElementById("categoryFilterModal").classList.contains("open")){
    document.getElementById("categoryFilterModal").classList.remove("open");
    document.getElementById("categoryFilterBtn").setAttribute("aria-expanded","false");
  }
});

ensureDefaultProductsPresent();
applyDefaultPricing();
render();
loadFromSheet();
</script>
</body>
</html>
